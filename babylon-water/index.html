/// and flush as one batched pass in the drain loop (audit #B4).
function stepSimulation() { return runPass(updatePass); }
function updateNormals()  { return runPass(normalPass); }

// --- water mesh --------------------------------------------------------------
// The pond mesh spans POND, not the window: the vertex shader displaces every
// vertex by the analytic ambient and adds the windowed deviation only where
// the window covers. ~1 m quads at 192 subdivisions over 200 m — the two long
// swell octaves displace fine at that pitch, and the short chop was already
// normal-only by design.
const water = BABYLON.MeshBuilder.CreateGround(
    "water", { width: POND, height: POND, subdivisions: SUBDIV }, scene
);

const waterMat = new BABYLON.ShaderMaterial("waterMat", scene,
    { vertex: "waterSurface", fragment: "waterSurface" },
    {
        attributes: ["position", "uv"],
        uniforms: ["world", "viewProjection", "cameraPos", "sunDir", "tint",
                   "time", "windStrength", "windDir", "detailScale", "waveScale",
                   "blurGain", "windowCenter"],
        samplers: ["sim", "envTex"],
    }
);
waterMat.setVector3("sunDir", sunDir);
// Kept as a live object rather than an inline literal so the panel can edit it
// in place. This is the murky-pond body colour — the non-reflective side of the
// Fresnel, which dominates at the bird's-eye angles the game will use.
const waterTint = new BABYLON.Color3(0.22, 0.30, 0.34);
waterMat.setColor3("tint", waterTint);

// The day's weather. strength 0 is dead glass, 1 is a choppy afternoon.
// Live-tunable: WIND.set(0.6, 40) for a moderate breeze out of 40 degrees.
const WIND = window.WIND = {
    // These three MUST equal POND_CONDITIONS in shared/ambientWater.js — the one
    // definition of the pond's still-water look, which the skip solver is tuned
    // against and the daily will roll around.
    //
    // Written as literals rather than imported because this is a classic script
    // (no import), and because `POND` here already means the pond's SIZE. The
    // agreement is enforced instead of expressed: ambient-sync-check.mjs parses
    // these values out of this file and fails if they drift, the same way it
    // already guards the octave table against AMBIENT_GLSL.
    strength: 0.01,
    dirDeg: 93,
    detail: 3.0,       // full detail, now that supersampling handles the aliasing
    waveScale: 8.0,    // 1 is the original fine chop; higher is longer swell
    // 45 per the same dump — at near-glass the reflection carries the frame,
    // so the variance-driven blur earns its four detailWeight terms per pixel
    // (the old 0.0 was measured against a busier surface).
    blurGain: 45.0,
    set(strength, dirDeg) {
        this.strength = strength;
        if (dirDeg !== undefined) this.dirDeg = dirDeg;
    },
};
waterMat.setTexture("envTex", envTex);
water.material = waterMat;

// --- drops -------------------------------------------------------------------
// Queued rather than applied immediately, because each drop is its own render
// pass and those have to happen inside the frame, not from an input callback.
// Callers work in WORLD METRES; the conversion to the normalised [-1, 1] space
// Evan's drop shader expects happens here, in one place. That keeps game code
// free of the sim's internal coordinates, and it is the same seam the windowed
// sim will later hook into to remap world position into a moving window.
const dropQueue = [];
// Note the asymmetry: positions are world metres and get converted, but the
// radius parameter stays in Evan's UV space — it feeds his drop shader
// unchanged, and both existing callers (stoneImpact, landing ripples) already
// speak that unit. Documented rather than refactored.
//
// Bounded, because the queue only drains while the sim is running: a pause, or
// the shader-compile frames at startup, would otherwise stockpile drops and
// then replay every one of them as its own full-screen render pass on the
// first live frame.
const DROP_QUEUE_MAX = 64;
function queueDrop(worldX, worldZ, strength, radius, shape) {
    if (dropQueue.length >= DROP_QUEUE_MAX) dropQueue.shift();
    lastDisturb = performance.now();   // AUDIT #6 — wakes the deviation sim
    // World metres, verbatim. The window may move between queue and drain, so
    // the world→window conversion happens at DRAIN time against the centre
    // the window actually has that frame — converting here would smear a
    // moving run's ripples by however far the window slid in between.
    dropQueue.push({
        x: worldX,
        z: worldZ,
        strength,
        radius: radius === undefined ? DROP_R : radius,
        // Shape, defaulted to the old circle so every existing caller — Plunge,
        // auto-rain, landing droplets — behaves exactly as it did.
        dirX: shape && shape.dirX !== undefined ? shape.dirX : 1,
        dirZ: shape && shape.dirZ !== undefined ? shape.dirZ : 0,
        elong: shape && shape.elong !== undefined ? shape.elong : 1,
        skew: shape && shape.skew !== undefined ? shape.skew : 0,
    });
}

// Clicking the water no longer makes a ripple.
//
// It was the original way to poke the sim, from when this page was only a water
// toy. On the skip lab it is now actively wrong: a click both stamped a drop AND
// snapped the interaction window to wherever you clicked — and a window snap
// clears the field, so an idle click in the middle of watching a run wiped the
// trail it had just laid down. That is the exact behaviour the run-placement
// work exists to prevent, reachable by accident with the mouse.
//
// The pointer belongs to the camera now: drag orbits, wheel zooms, and nothing
// you do with it can destroy a run. Ripples come from the stone (Throw / space)
// and from Plunge; auto-rain (D) still works for testing the sim on its own.

// --- controls ------------// --- controls ----------------------------------------------------------------
let paused = false, raining = false;
addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "p") paused = !paused;
    if (k === "d") raining = !raining;
    if (k === "r") reset();
});

let needsSeed = false;
function reset() {
    passSrc = simA;
    engine.unbindAllTextures();
    if (!clearPass.effect.isReady()) return false;
    // Both targets, since either may be read first after a swap.
    effectRenderer.render(clearPass, simB);
    effectRenderer.render(clearPass, simA);
    needsSeed = true;
    return true;
}

/// His opening state: 20 drops of alternating sign, inside the current window.
function seed() {
    for (let i = 0; i < 20; i++) {
        queueDrop(windowCenter.x + (Math.random() * 2 - 1) * HALF * 0.9,
                  windowCenter.y + (Math.random() * 2 - 1) * HALF * 0.9,
                  (i & 1) ? DROP_S : -DROP_S);
    }
}

// =============================================================================
// Splash — diffuse particles on top of the height field.
//
// Structured on the standard whitewater pipeline (Ihmsen et al. 2012, "Unified
// Spray, Foam and Bubbles for Particle-Based Fluids", the method behind
// Houdini/Blender whitewater and SPlisHSPlasH's foam generator): compute scalar
// POTENTIALS, clamp each to a min/max window, multiply them into a spawn count,
// emit ballistic particles, and classify them into spray/foam/bubbles.
//
// Two deliberate departures, both because our situation differs from the paper:
//
//   1. The paper INFERS potentials from an SPH particle fluid via neighbour
//      sums, because the fluid is all it has. We have the stone itself, so the
//      potentials are computed from its real impact state instead. That is
//      strictly better information, not a shortcut — impact angle in particular
//      is a property of the object that a height field cannot recover.
//   2. No bubble class. Bubbles are the submerged category, and this water is
//      reflection-only with no transparency, so nothing below the surface is
//      visible. Emitting them would cost particles that can never be seen.
// =============================================================================

// Tuning, live-editable from the console. The two-element arrays are the
// paper's min/max clamp windows.
// Windows calibrated against real stone energies, not guessed: a 0.15 kg stone
// at 9 m/s is already 6.1 J and at 14 m/s is 14.7 J, so a window topping out at
// 6 J pinned the potential at 1.0 for nearly every realistic throw and made
// speed differences invisible above walking pace. Measured and widened.
const SPLASH = window.SPLASH = {
    // Master switch for the whole particle layer. The airborne spray works, so
    // this is on. The ripple an impact makes is NOT gated by it either way:
    // that belongs to the water sim, not the particle layer.
    particles:  true,

    // Surface foam, off. It was billboard sprites spawned lying at the
    // waterline with no gravity, so a few hundred of them piled up at the
    // impact and read as one flat white disc pasted on the water — a sprite
    // artefact, not aeration. Surface foam is the wrong thing to build out of
    // camera-facing quads: it belongs ON the surface, written into the water
    // shader the way the old aeration channel did it, so it follows the
    // waves instead of floating as a disc. Left off until it is done that way.
    surfaceFoam: false,
    keWindow:   [0.05, 30.0],  // kinetic-energy potential clamp, joules
    taWindow:   [0.5,  9.0],   // trapped-air potential clamp, m/s
    plungeTA:   0.35,          // how much a vertical impact entrains vs a shear
    // 3000 rather than 8000. A hard impact was spawning 6,682 droplets, each an
    // alpha-blended quad — and alpha blending cannot early-out on depth, so the
    // overdraw is paid in full, multiplied again by supersampling.
    sprayScale: 3000,          // particles at full potential product
    foamScale:  1500,
    globFraction: 0.14,        // share of droplets drawn as fat globules rather
                               // than fine mist
    // Measured, not guessed: CPU particle cost is linear at roughly 0.5us per
    // live particle per frame (6.7k = 3.7ms, 33k = 14.2ms). The whole 60fps
    // budget is 16.7ms and the water sim and scene need most of it, so live
    // particles are capped here. This matters specifically because a skipping
    // stone lands repeatedly and the bursts OVERLAP — six skips in flight hit
    // 41k particles and 19.6ms, i.e. under 60fps, before this cap existed.
    maxLive:    6000,
    // --- ripple amplitude, in VOLUME rather than in vibes ---------------
    //
    // Every number below scales a real displaced volume. `rippleGain` is a
    // master multiplier on all of it and 1.0 means "exactly what the solver
    // says" — so the honest tuning position is 1.0, and anything else is a
    // deliberate departure with the size of the lie on the slider.
    rippleGain: 1.0,
    /** Hard cap on a single crater's depth, metres. Only a cannonball-class
     *  plunge should ever reach it. */
    rippleMax:  0.060,
    /** Rim height as a multiple of crater depth. RIM_NEUTRAL displaces zero net
     *  volume — the physical answer, and the one that keeps the pond's mean
     *  level from drifting over a run that never clears. */
    rim: RIM_NEUTRAL,

    // --- crater SHAPE, from the impact geometry -------------------------
    /** Cap on how long a gouge gets. Length goes as 1/sin(attack), so a very
     *  shallow arrival would run away. 5 is about an 11.5 degree impact — the
     *  top of the 3-5x range oblique impacts actually produce. */
    elongMax: 5.0,
    /** Floor on elongation for anything moving horizontally. A contact patch
     *  dragged across the surface is never circular, however steeply the stone
     *  came in, so a moving crater never collapses all the way to a dot. */
    elongMin: 1.6,
    /** How far spin leans the crater sideways. Real — it is the same asymmetry
     *  that gives a run its lateral drift. */
    spinSkew: 0.55,
    /**
     * How far BEHIND the contact point the crater sits, as a fraction of the
     * extra length elongation gives it.
     *
     * A gouge is a scar, and a scar is left behind. Centring the ellipse on the
     * impact put half the furrow in water the stone had not reached yet, which
     * is exactly the "stamped on" read: nothing about it said which way the
     * thing was going. 0.5 puts the leading edge on the contact point and
     * trails the rest.
     */
    craterTrail: 0.5,
    /**
     * How much the stone's roll narrows its contact patch.
     *
     * A stone landing flat presents its whole face. One tipped onto an edge
     * presents a sliver, and digs a narrow gouge at the same volume — deeper,
     * because the volume has nowhere else to go. 1 is the full geometric
     * cos(bank) narrowing, 0 ignores attitude.
     */
    rollNarrow: 1.0,

    // --- the stone PLOUGHING, not bouncing ------------------------------
    /**
     * Master switch on continuous displacement: ploughing through a contact,
     * chattering, coasting, wobbling and sinking. 1.0 is volume-true.
     *
     * This is driven by the RATE OF CHANGE of the solver's displaced volume,
     * not by the volume itself. That distinction is the whole fix: a constant
     * volume is a stone floating still, which makes no waves, while dV/dt is
     * water actually being pushed out of the way, which is what a wave IS.
     */
    ploughGain: 1.0,
    /** A furrow is longer than a crater. This is what reads as "dragging
     *  through" rather than "landing on". */
    ploughElong: 7.0,
    /**
     * Ram-pressure dimple under a stone that is CLOSE to the water but has not
     * touched it — the air cushion a fast flat plate rides on in ground effect.
     *
     * Real, and it is what makes a run read as one continuous event instead of
     * a row of stamps: a moving pressure source is exactly what draws a wake
     * between the bounces. The magnitude is stagnation pressure over rho*g,
     * attenuated by gap; this gain scales the whole thing, because the fraction
     * of stagnation pressure that actually reaches the surface at a given gap
     * is not something this page can derive.
     */
    groundEffect: 0.35,
    /** Gaps beyond this many stone radii get no ground effect at all. */
    groundEffectRadii: 3.0,

    // Converts the stone's real-world m/s into this pool's units. Without it,
    // emit power inherits metres-per-second directly while the whole pool is
    // only 2 units wide, so droplets launched at 16 units/s reach an apex of
    // 14 units — seven times the pool's width — and expire in mid-air long
    // before falling back. That is measured, and it is why nothing ever landed.
    // Sized so a hard impact peaks a few percent of the pool across and
    // completes its arc well inside a particle lifetime.
    // Now that a world unit IS a metre, the stone's m/s no longer needs a big
    // correction — gravity at -9.81 is simply correct. This only tempers how
    // far droplets are thrown, since a literal reading sends them metres up.
    emitScale:  0.35,

    // Ripples from spray landing back in the water. Detection is free — the
    // waterline crossing is already found every frame in order to retire
    // submerged particles — so this only decides which landings earn a ripple.
    // The cap is the load-bearing part: every drop is its own full render pass
    // in Evan's design, so N landings means N extra passes that frame.
    /**
     * Base droplet size band, metres. The LIVE band on sprayPS is this scaled
     * by the impact, so a hard strike throws bigger droplets as well as more of
     * them — a burst that only ever changes in count reads as the same splash
     * turned up, not as a harder one.
     */
    spraySize: [0.02, 0.06],
    /** How far the size band stretches between the weakest and hardest impact. */
    spraySizeRange: 2.2,

    landing: {
        enabled: true,
        // Low enough that ordinary droplets ring too, not just the giants. A
        // droplet you can watch land and which then does nothing to the water
        // is its own kind of mismatch.
        minSize: 0.016,
        maxPerFrame: 12,   // hard ceiling on added drop passes per frame
        gain: 1.0,
        // Ripple size is read straight off the particle rather than from a
        // normalised band, so a droplet's crater is always a fixed multiple of
        // the droplet you actually watched fall. That is what keeps the two
        // from disagreeing.
        craterPerSize: 3.0,
        // Strength rises steeply with size because impact energy does: mass
        // goes as diameter cubed. A squarish power keeps the fat globules
        // clearly dominant without making the mist ring at literally zero.
        sizePower: 2.2,
    },
};

function makeSprite(size, name) {
    const dt = new BABYLON.DynamicTexture(name, size, scene, false);
    const ctx = dt.getContext();
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    // A tight, mostly-solid core rather than a broad haze. Once droplets are
    // only a couple of pixels across, a soft gradient spends all of them on
    // falloff and the particle reads as a faint smudge instead of a droplet.
    g.addColorStop(0.0, "rgba(255,255,255,1)");
    g.addColorStop(0.45, "rgba(255,255,255,0.95)");
    g.addColorStop(0.78, "rgba(255,255,255,0.35)");
    g.addColorStop(1.0, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    dt.hasAlpha = true;
    dt.update();
    return dt;
}
const splashSprite = makeSprite(64, "splashSprite");

// Spray: torn from the surface and thrown clear, so it is ballistic and gets
// real gravity. Short-lived and small — this is the part that reads as impact.
// Capacity has to cover several overlapping impacts, not just one, since a
// skipping stone lands repeatedly before the first burst has died. 20k rather
// than 60k: the buffer is allocated up front whether or not it is used, and
// maxLive caps concurrent particles well below this anyway.
const sprayPS = new BABYLON.ParticleSystem("spray", 20000, scene);
sprayPS.particleTexture = splashSprite;
sprayPS.emitter = new BABYLON.Vector3(0, 0, 0);
sprayPS.gravity = new BABYLON.Vector3(0, -9.81, 0);
// Scaled up with the pond. At 20 m the view resolves about 53 px per metre, so
// a physically honest 3 mm droplet would be a twentieth of a pixel and simply
// vanish. These are 2-6 cm: deliberately larger than real droplets, because
// below roughly a pixel a particle stops reading and starts flickering.
sprayPS.minSize = 0.02; sprayPS.maxSize = 0.06;
// Deliberately longer than any flight. Now that alpha no longer fades, a
// particle reaching the end of its lifetime would POP rather than dissolve, so
// the lifetime has to outlast the arc instead of merely overlapping it: the
// hardest impact launches at about 9.5 m/s vertically, a 1.9 s round trip.
// Nothing is wasted by the generous figure, because droplets are retired the
// instant they touch the water — lifetime is only the backstop.
sprayPS.minLifeTime = 2.4; sprayPS.maxLifeTime = 3.2;
sprayPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
// Alpha stays at 1 all the way to colorDead, so a droplet does NOT thin out in
// mid-air. Water in flight does not evaporate on the way down — it lands. The
// particle is instead retired the moment it crosses the waterline (see
// retireSubmerged), which reads as the droplet being absorbed on impact.
sprayPS.color1 = new BABYLON.Color4(1.25, 1.35, 1.45, 1.0);
sprayPS.color2 = new BABYLON.Color4(0.95, 1.05, 1.20, 1.0);
sprayPS.colorDead = new BABYLON.Color4(0.95, 1.05, 1.20, 1.0);
// Bursts only. Babylon's default emitRate is 10/sec, which quietly trickled
// droplets out of the last impact point forever — visible as a thin permanent
// dribble, and it kept the particle array from ever emptying.
sprayPS.emitRate = 0;
sprayPS.manualEmitCount = 0;
sprayPS.start();

// Foam: stays at the surface, spreads outward and dissipates in place. No
// gravity — it is riding the water, not flying through air.
const foamPS = new BABYLON.ParticleSystem("splashFoam", 6000, scene);
foamPS.particleTexture = splashSprite;
foamPS.emitter = new BABYLON.Vector3(0, 0, 0);
foamPS.gravity = new BABYLON.Vector3(0, 0, 0);
foamPS.minSize = 0.05; foamPS.maxSize = 0.25;
foamPS.minLifeTime = 0.6; foamPS.maxLifeTime = 1.8;
foamPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
foamPS.color1 = new BABYLON.Color4(1.0, 1.1, 1.2, 0.85);
foamPS.color2 = new BABYLON.Color4(0.85, 0.95, 1.05, 0.6);
foamPS.colorDead = new BABYLON.Color4(0.8, 0.9, 1.0, 0.0);
foamPS.emitRate = 0;
foamPS.manualEmitCount = 0;
foamPS.start();

// --- stopping the particles from clipping into the water ---------------------
// Particles are camera-facing quads. Where a quad passes through the y=0 plane
// the water wins the depth test and slices it, which is the straight-edged cut
// visible along the surface — a sprite artefact, not anything about the water.
//
// The fix is to draw them with the depth test disabled, in a later rendering
// group so they come after all opaque geometry. Babylon has no
// onAfterDrawParticlesObservable, so the depth function is restored once at the
// end of the frame and again defensively at the start of the next one.
const DEPTH_ALWAYS = BABYLON.Constants.ALWAYS;
const DEPTH_LEQUAL = BABYLON.Constants.LEQUAL;
for (const ps of [sprayPS, foamPS]) {
    ps.renderingGroupId = 1;
    ps.onBeforeDrawParticlesObservable.add(() => engine.setDepthFunction(DEPTH_ALWAYS));
}
scene.onAfterRenderObservable.add(() => engine.setDepthFunction(DEPTH_LEQUAL));

/// Ignoring depth means a particle that has fallen BELOW the surface would
/// still draw on top of it, which reads as a droplet stuck inside the water.
/// Retiring them at the waterline is what keeps that honest, and it doubles as
/// the visual of spray being reabsorbed when it lands.
function retireSubmerged() {
    const L = SPLASH.landing;
    let budget = L.enabled ? L.maxPerFrame : 0;

    // Spray falls back and lands. Foam has no gravity and drifts along the
    // surface, so it never crosses the waterline and never rings.
    const arr = sprayPS.particles;
    for (let i = 0; i < arr.length; i++) {
        const p = arr[i];
        if (p.position.y >= 0) continue;
        p.age = p.lifeTime;

        // Only the fattest droplets, and only while there is pass budget left.
        if (budget <= 0 || p.size < L.minSize) continue;
        const px = p.position.x, pz = p.position.z;
        // Off the interaction WINDOW (not the pond): a landing ripple outside
        // it has no deviation field to write into. The droplet still splashed
        // visually; only its ripple is skipped, same as any out-of-window drop.
        if (Math.abs(px - windowCenter.x) >= HALF ||
            Math.abs(pz - windowCenter.y) >= HALF) continue;

        // A droplet's ring scales with how big it is and how hard it arrives.
        // Both are known exactly here: size is the particle's own, and
        // direction is its live velocity, so the impact speed is real rather
        // than assumed.
        // Both the crater and its strength come from THIS droplet — its actual
        // size and its live impact speed — rather than from a normalised band.
        // A fat globule therefore lands a broad, deep ring and a speck of mist
        // lands a faint pinprick, and neither can disagree with the droplet the
        // eye just followed down.
        const sizeN = clamp01(p.size / Math.max(1e-6, sprayPS.maxSize));
        const vy = Math.abs(p.direction.y);
        const strength = L.gain * DROP_S * Math.pow(sizeN, L.sizePower) * clamp01(vy / 6.0);
        if (strength <= 0) continue;

        // Crater width in world metres, converted to the UV the drop shader
        // wants. Tied directly to the droplet's diameter.
        const craterUV = (p.size * L.craterPerSize) / SIZE;
        queueDrop(px, pz, strength, craterUV);
        budget--;
    }

    const foam = foamPS.particles;
    for (let i = 0; i < foam.length; i++) {
        if (foam[i].position.y < 0) foam[i].age = foam[i].lifeTime;
    }
}

// --- emission shape ----------------------------------------------------------
// The default BoxParticleEmitter spawns in a cuboid and spreads through a
// cuboid of directions, which is exactly why a burst read as a square block of
// droplets. An impact is radially symmetric, so both the footprint and the
// spread have to be discs/cones. These override the emitter entirely.
const sprayBurst = { radius: DROP_R, dirX: 1, dirZ: 0, fwd: 0, vert: 1, spread: 0.4 };
const foamBurst  = { radius: DROP_R };

sprayPS.startPositionFunction = (worldMatrix, positionToUpdate, particle, isLocal) => {
    const a = Math.random() * Math.PI * 2;
    // sqrt() keeps the disc UNIFORM. Without it points bunch at the centre,
    // which is the other half of why the cluster looked like a solid lump.
    const r = sprayBurst.radius * Math.sqrt(Math.random());
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (isLocal) positionToUpdate.copyFromFloats(x, 0, z);
    else BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(x, 0, z, worldMatrix, positionToUpdate);
};
sprayPS.startDirectionFunction = (worldMatrix, directionToUpdate, particle, isLocal) => {
    const a = Math.random() * Math.PI * 2;
    const s = sprayBurst.spread * Math.sqrt(Math.random());
    const cx = sprayBurst.dirX * sprayBurst.fwd + Math.cos(a) * s;
    const cz = sprayBurst.dirZ * sprayBurst.fwd + Math.sin(a) * s;
    const cy = sprayBurst.vert * (0.55 + Math.random() * 0.9);
    if (isLocal) directionToUpdate.copyFromFloats(cx, cy, cz);
    else BABYLON.Vector3.TransformNormalFromFloatsToRef(cx, cy, cz, worldMatrix, directionToUpdate);

    // Size and scale are NOT set here. Babylon assigns both after this hook
    // returns, so anything written to them is overwritten — measured, the
    // distribution came back perfectly uniform. They are applied in
    // shapeNewSpray() below instead.
};

// --- droplet size and shape --------------------------------------------------
// Babylon's own sizing is UNIFORM between min and max, which is why the spray
// read as one grade of grit. Real spray is mostly fine mist with a scattering
// of fat globules torn off the surface, so the distribution is deliberately
// lopsided: a steep power curve puts the bulk at the small end, and a minority
// draw separately into the top of the range. The GAP between the two
// populations is the point — a smooth spread just looks uniform again.
//
// This runs from onBeforeDrawParticlesObservable, which fires after the
// particle update but before the first draw, so a new droplet is never shown
// at Babylon's uniform size even for one frame.
//
// New droplets are recognised by their AGE RUNNING BACKWARDS. Particles are
// pooled, so a recycled object still carries the previous droplet's fields and
// "have I seen this object before" is the wrong question. An earlier version
// asked exactly that via a generation counter bumped once per burst, and it
// had a visible bug: firing a new burst re-randomised every droplet still in
// flight from the PREVIOUS burst (their marker no longer matched), so the
// whole spray popped to new sizes mid-air. Age regression identifies only the
// genuinely recycled slots — a live droplet's age climbs monotonically, while
// a reused slot restarts near zero, and retirement parks age at lifeTime
// (seconds), so the drop back to zero is unmistakable.

// In-flight deformation. A droplet in air is not a rigid bead: surface tension
// pulls it back toward a sphere while it overshoots, so it RINGS between
// stretched and flattened, and airflow drags it out along its path.
//
// Both effects depend on size, and in opposite directions — which is the part
// that makes it read as water rather than as wobbling sprites:
//   - Surface tension per unit mass scales as 1/radius, so SMALL droplets are
//     stiffer. They deform less but oscillate faster.
//   - Rayleigh's result for an oscillating drop gives frequency proportional to
//     r^-3/2, so a droplet twice the size wobbles nearly three times slower.
// A big globule therefore lolls and stretches while fine mist stays taut and
// shivers, from one rule rather than from two hand-tuned cases.
const SHAPE = window.SHAPE = {
    wobble: 0.92,   // oscillation depth for the largest droplets
    oscFreq: 14.0,  // base ringing rate, scaled per droplet by size^-1.5
    aero: 0.12,     // elongation along the direction of travel, per m/s
    // Motion blur. Measured, a fast droplet crosses 4.4 of its own widths per
    // frame, so it never lands adjacent to where it was and the eye reads a
    // row of stills rather than movement. Particles are drawn once per render
    // frame, so no update rate can fix that — the gap has to be COVERED, which
    // is what a real camera does with a finite shutter. This stretches a sprite
    // along its path far enough to bridge its own per-frame travel.
    motionBlur: 0.85,
    // Fraction of the velocity direction's rotation the sprite actually follows.
    // 0.25 is a quarter of the rate, i.e. four times slower. This scales the
    // rate of change rather than damping toward the target: a damped follow
    // still ends up rotating at full speed, merely lagging behind it.
    spin: 0.10,
};

const _vdir = new BABYLON.Vector3();

function shapeSpray() {
    const ps = sprayPS.particles;
    const mn = sprayPS.minSize, mx = sprayPS.maxSize;
    const span = Math.max(1e-6, mx - mn);
    // View matrix, so the stretch axis can be aligned with the droplet's motion
    // as it appears ON SCREEN. Stretching along a world axis would look wrong
    // the moment the camera turned.
    const m = scene.getViewMatrix().m;

    // How much particle-time one frame advances. Babylon steps particles by
    // updateSpeed scaled by the animation ratio, NOT by real seconds, so the
    // per-frame travel has to be derived from the same figure the engine uses
    // or the blur would not match the gap it is covering.
    const ratio = Math.min(3, Math.max(0.3, scene.getAnimationRatio()));
    const stepSec = sprayPS.updateSpeed * ratio;

    for (let i = 0; i < ps.length; i++) {
        const p = ps[i];

        // A retired droplet — parked under the waterline by retireSubmerged —
        // still gets one draw before Babylon recycles it on the next update,
        // and with the depth test disabled for particles that corpse renders
        // ON TOP of the water from underneath for a frame. Collapse it to a
        // zero-area quad instead of drawing it.
        if (p.position.y < 0) { p.scale.x = 0; p.scale.y = 0; continue; }

        const lastAge = p.__lastAge;
        p.__lastAge = p.age;
        if (lastAge === undefined || p.age < lastAge) {
            const t = Math.random() < SPLASH.globFraction
                ? 0.62 + 0.38 * Math.random()         // globules
                : Math.pow(Math.random(), 2.6) * 0.5; // fine mist
            p.size = mn + span * t;
            p.__phase = Math.random() * 6.2831853;
            p.__base = 0.85 + Math.random() * 0.35;
            // Cleared so a recycled particle does not inherit the heading of
            // whatever droplet last used this slot and snap round on its first
            // frame.
            p.__prevTarget = undefined;
        }

        const d = p.direction;
        const speed = Math.sqrt(d.x * d.x + d.y * d.y + d.z * d.z);
        // Clamped: the band moves between bursts now (see spraySizeRange), so a
        // droplet from a harder impact can be outside the band a later, softer
        // one installed. Unclamped that reads as negative or >1 "size" and the
        // deformation terms below invert.
        const sizeN = clamp01((p.size - mn) / span); // 0 mist, 1 globule

        // Ringing. Frequency falls with size, amplitude rises with it.
        const w = SHAPE.oscFreq * Math.pow(Math.max(p.size, 1e-4) / mx, -1.5);
        const wob = Math.sin(p.age * w + p.__phase) * SHAPE.wobble * (0.25 + 0.75 * sizeN);

        // Drag stretch, strongest when moving fastest and on the softer drops.
        const aero = SHAPE.aero * speed * (0.2 + 0.8 * sizeN);

        // Elongation along travel, with the perpendicular axis shrinking to
        // match so the droplet keeps its area — it is deforming, not growing.
        // Clamped at both ends. Note the visible ASPECT RATIO is e squared,
        // since one axis grows by e while the other shrinks by e — so this cap
        // of 1.55 permits about 2.4:1, not 1.55:1. That is roughly where real
        // drops stop stretching and break up into smaller drops instead, and
        // unbounded the fastest ones were reaching 7:1, which reads as a needle
        // rather than as water.
        const eShape = Math.min(1.55, Math.max(0.68, 1.0 + wob + aero));

        // Motion blur, in units of the droplet's own width. The threshold is
        // below 1 because the gap opens before the travel exceeds a full width.
        // Only the along-path axis grows: a smear LENGTHENS a shape, it does
        // not squeeze it, so the perpendicular axis keeps the deformation value
        // and nothing gets thinner just because it is moving.
        const widths = (speed * stepSec) / Math.max(p.size, 1e-4);
        const motion = Math.min(8.0, 1.0 + SHAPE.motionBlur * Math.max(0.0, widths - 0.6));

        const b = p.__base;
        p.scale.x = b * eShape * motion;
        p.scale.y = b / eShape;

        // Point that stretch along the screen-space direction of travel.
        _vdir.x = d.x * m[0] + d.y * m[4] + d.z * m[8];
        _vdir.y = d.x * m[1] + d.y * m[5] + d.z * m[9];
        if (speed > 1e-4) {
            const target = Math.atan2(_vdir.y, _vdir.x);
            if (p.__prevTarget === undefined) {
                p.__prevTarget = target;
                p.__ang = target;
            }
            // Take the shortest way round, or the sprite spins the long way
            // whenever the heading crosses the +/-PI wrap.
            let da = target - p.__prevTarget;
            if (da > Math.PI) da -= 6.2831853;
            else if (da < -Math.PI) da += 6.2831853;
            p.__ang += da * SHAPE.spin;
            p.__prevTarget = target;
            p.angle = p.__ang;
        }
    }
}
sprayPS.onBeforeDrawParticlesObservable.add(shapeSpray);

foamPS.startPositionFunction = (worldMatrix, positionToUpdate, particle, isLocal) => {
    const a = Math.random() * Math.PI * 2;
    const r = foamBurst.radius * Math.sqrt(Math.random());
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (isLocal) positionToUpdate.copyFromFloats(x, 0, z);
    else BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(x, 0, z, worldMatrix, positionToUpdate);
};
foamPS.startDirectionFunction = (worldMatrix, directionToUpdate, particle, isLocal) => {
    // Foam spreads outward across the surface, so direction follows the angle
    // it was spawned at rather than being independent of it.
    const a = Math.random() * Math.PI * 2;
    const cx = Math.cos(a), cz = Math.sin(a);
    if (isLocal) directionToUpdate.copyFromFloats(cx, 0.03 + Math.random() * 0.05, cz);
    else BABYLON.Vector3.TransformNormalFromFloatsToRef(cx, 0.03 + Math.random() * 0.05, cz, worldMatrix, directionToUpdate);
};

// --- droplets shaded as water ------------------------------------------------
// A flat white sprite reads as a dust mote. This shades each billboard as a
// tiny SPHERE reflecting the same HDRI cube the water surface reflects, with
// the same Fresnel curve — so a droplet is literally a small mirror of the same
// sky, and the spray belongs to the water instead of sitting on top of it.
//
// Only the spray gets this. Foam stays opaque white on purpose: it is aerated
// bubbles, which scatter rather than mirror, so making it reflective would be
// wrong for what it represents.
BABYLON.Effect.ShadersStore["dropletParticlePixelShader"] = glsl(`
precision highp float;
varying vec2 vUV;
varying vec4 vColor;
uniform samplerCube envTex;
uniform mat4 invView;

void main(void) {
    vec2 p = vUV * 2.0 - 1.0;
    float r2 = dot(p, p);
    // Round, not square — this also discards the corners of the quad, which is
    // what stops a droplet from ever showing its billboard edges.
    if (r2 > 1.0) discard;
    vec3 nView = vec3(p.x, p.y, sqrt(1.0 - r2));

    // In view space the camera looks down -z, so the vector toward the eye is +z.
    vec3 vView = vec3(0.0, 0.0, 1.0);
    vec3 rWorld = (invView * vec4(reflect(-vView, nView), 0.0)).xyz;
    vec3 refl = textureCube(envTex, normalize(rWorld)).rgb;

    // The same Fresnel curve as the surface, so a droplet and the water agree
    // about how reflective water is at a given angle.
    float f = mix(0.25, 1.0, pow(1.0 - max(nView.z, 0.0), 3.0));
    vec3 col = refl * mix(vec3(0.30, 0.42, 0.52), vec3(1.0), f);

    float edge = smoothstep(1.0, 0.5, r2);
    gl_FragColor = vec4(col, vColor.a * edge);
}
`);

const dropletEffect = engine.createEffectForParticles("dropletParticle", ["invView"], ["envTex"]);
sprayPS.setCustomEffect(dropletEffect);
sprayPS.onBeforeDrawParticlesObservable.add(() => {
    // camera.getWorldMatrix() IS the inverse view matrix — it maps camera space
    // to world, which is exactly what turns the view-space reflection into a
    // direction the cube can be sampled with.
    dropletEffect.setMatrix("invView", camera.getWorldMatrix());
    dropletEffect.setTexture("envTex", envTex);
});

const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
/** Two-sided clamp. `clamp` is a GLSL builtin, not a JS one — the shaders above
 *  use it freely and it is easy to reach for on this side by mistake. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const windowed = (v, w) => clamp01((v - w[0]) / (w[1] - w[0]));

// =============================================================================
// From the stone's geometry to a crater. One place, so an impact, a plough, a
// wobble and a sink cannot disagree about what a given volume of water looks
// like when it is pushed out of the way.
// =============================================================================

/** Water, for the energy fallback below. */
const RHO_W = 1000, GRAV = 9.81;
/** Air, for the ground-effect dimple. */
const RHO_A = 1.2;

/**
 * Footprint and orientation of the mark the stone is about to leave.
 *
 *   patchR    true wetted-patch radius, METRES
 *   elongWant length/width the geometry asks for, before clamping
 *   o.bankRad roll. A stone on its edge presents a sliver, not a face.
 *   o.aspect  the stone's own长/短 ratio — an oblong pebble leaves an oblong
 *             mark even landing flat, which is the whole reason rock shape is
 *             allowed to show up in the water at all.
 *   o.spinRPS signed spin, for the sideways lean.
 *
 * Returns the ACROSS-travel radius in Evan's UV, the elongation along travel,
 * the lateral skew, and how far back along travel the mark should sit.
 */
function shapeCrater(patchR, elongWant, o) {
    // Band-limit first (see MIN_DROP_CELLS), then shape. The true patch is far
    // under one cell, so shaping the true patch and then flooring it would
    // throw the shape away — every crater would come out the same circle,
    // which is exactly what the last pass shipped.
    const baseR = Math.max(MIN_DROP_R, patchR / SIZE);
    // cos(bank) is the projected width of a tilted face. Floored, because a
    // crater one texel wide is not a narrow gouge, it is aliasing.
    const narrow = Math.max(0.45,
        1 - SPLASH.rollNarrow * (1 - Math.abs(Math.cos(o.bankRad || 0))));
    const across = baseR * narrow;
    // What roll takes off the width it puts back into the length: the water
    // still has to go somewhere. Same volume, thinner and longer.
    const elong = clamp((elongWant * (o.aspect || 1)) / narrow, 1, SPLASH.elongMax);
    return {
        across,
        elong,
        skew: clamp(-(o.spinRPS || 0) / 120, -1, 1) * SPLASH.spinSkew,
        /** Metres to shift the centre BACKWARD along travel, so the leading
         *  edge sits on the contact point and the furrow trails. */
        trail: across * SIZE * (elong - 1) * SPLASH.craterTrail,
    };
}

/**
 * Depth of a crater that holds `volume` cubic metres.
 *
 * The inverse of the shader's own profile integral, so what comes out of the
 * texture is the volume that went in — whatever radius legibility forced.
 */
function craterDepth(volume, across, elong) {
    const R = across * SIZE;
    return volume / (Math.PI * R * R * elong * CRATER_KAPPA);
}

/**
 * Depth of a crater that ABSORBS `joules`, for callers that know an energy but
 * not a volume (Plunge, the demo buttons).
 *
 * The potential energy of a depression of depth D over that footprint is
 * rho*g*D^2*pi*R^2*kappa2/2, so D falls out as a square root. Deliberately NOT
 * used for skip bounces: a stone that bounces keeps nearly all its energy, so
 * an energy-driven crater over-reads a glancing skip by two orders of
 * magnitude. This form is only right when the impact actually SPENDS itself.
 */
const CRATER_KAPPA2 = 0.172358;   // integral of w(u)^2 * 2u du over the unit disc
function craterDepthFromEnergy(joules, across, elong, efficiency) {
    const R = across * SIZE;
    const denom = RHO_W * GRAV * Math.PI * R * R * elong * CRATER_KAPPA2;
    return Math.sqrt(Math.max(0, 2 * efficiency * joules) / Math.max(1e-9, denom));
}

/**
 * Queue a crater the stone made: shape it, place it behind the contact, clamp
 * it, fire it. Returns the depth actually used, in metres.
 */
function craterDrop(x, z, depth, dirX, dirZ, shape) {
    const d = Math.min(Math.abs(depth), SPLASH.rippleMax) * Math.sign(depth);
    if (!(Math.abs(d) > 1e-7)) return 0;
    const dl = Math.hypot(dirX, dirZ) || 1;
    const ux = dirX / dl, uz = dirZ / dl;
    queueDrop(x - ux * shape.trail, z - uz * shape.trail, d, shape.across,
        { dirX: ux, dirZ: uz, elong: shape.elong, skew: shape.skew });
    return d;
}

/// The stone hook. Everything an impact does to the water goes through here, so
/// the ripple and the splash cannot disagree about how hard the hit was.
///
///   x, z    world position on the pond, in METRES, anywhere on +/-POND_HALF.
///           The interaction window snaps to each impact and queueDrop maps
///           world into the window's own space at drain time.
///   opts.speed    impact speed, m/s
///   opts.mass     kg
///   opts.angle    radians below horizontal. 0 is a grazing skip, PI/2 straight
///                 down. This is what separates a skip from a plunge and it is
///                 why the stone has to supply it rather than the water guess.
///   opts.dirX/dirZ  horizontal travel direction, normalised
///   opts.radius   contact patch as a FRACTION of the pond span — Evan's UV
///                 unit, the same thing addDrop takes; defaults to DROP_R.
///                 The spray disc needs metres, so that one is converted at
///                 the burst assignment below.
function stoneImpact(x, z, opts) {
    // THE WINDOW IS PLACED ONCE PER RUN, AND THEN NEVER MOVED.
    //
    // Every scroll destroys trail: content shifted past the edge is gone, and
    // what scrolls in is zero. So the way to stop ripples being cleared is not
    // to scroll less cleverly — lazy follow, hysteresis, all of it still cleared
    // them, just later. It is to not scroll at all while a run is in progress.
    //
    // That is possible because a run is predictable. `opts.dirX/dirZ` is the
    // travel direction, known at the FIRST impact, so the window can be dropped
    // ahead of the stone to cover the whole lane before it gets there. 0.72 of
    // a half-span downrange is what makes a 50 m run fit: measured against the
    // USABLE window rather than the raw one, since winFade takes the outer 8%
    // (5.1 m a side at 64 m), that leaves 49.9 m ahead of the first splash and
    // 3.8 m behind it. One scroll for the whole run — the placement itself —
    // against nine with a lazy follow and about fifty when it centred on every
    // bounce. So every ripple a run makes is still there when it stops.
    //
    // A "run" ends when nothing has hit the water for RUN_GAP_MS. The next
    // impact after that is a new run and gets a new placement — which does
    // clear the field, correctly: you have thrown somewhere else.
    const now = performance.now();
    if (now - lastImpactAt > RUN_GAP_MS) {
        const dl = Math.hypot(opts.dirX ?? 1, opts.dirZ ?? 0) || 1;
        const lead = (SIZE / 2) * 0.72;
        windowTarget.x = x + ((opts.dirX ?? 1) / dl) * lead;
        windowTarget.z = z + ((opts.dirZ ?? 0) / dl) * lead;
    }
    lastImpactAt = now;

    const speed  = opts.speed  !== undefined ? opts.speed  : 6;
    const mass   = opts.mass   !== undefined ? opts.mass   : 0.15;
    const angle  = opts.angle  !== undefined ? opts.angle  : Math.PI / 4;
    const dirX   = opts.dirX   !== undefined ? opts.dirX   : 1;
    const dirZ   = opts.dirZ   !== undefined ? opts.dirZ   : 0;
    const radius = opts.radius !== undefined ? opts.radius : DROP_R;

    const sinA = Math.sin(angle), cosA = Math.cos(angle);
    const energy = 0.5 * mass * speed * speed;

    // The two potentials, each clamped to its window as the paper does.
    // Trapped air is driven by the TANGENTIAL component, because shearing
    // across the surface is what drags air under — which is exactly why a
    // shallow skip aerates far more than its modest energy would suggest.
    const iKE = windowed(energy, SPLASH.keWindow);
    // Shear dominates — a stone skimming flat drags far more air under than its
    // energy suggests — but a vertical plunge entrains too, when its crown
    // collapses. Driving this from shear ALONE gave a straight-down impact
    // exactly zero foam, which is plainly wrong, so the vertical component
    // contributes at a reduced weight rather than not at all.
    const iTA = windowed(
        speed * cosA + SPLASH.plungeTA * speed * sinA,
        SPLASH.taWindow
    );

    // Spawn counts are the product of the clamped potentials, scaled.
    let sprayCount = Math.round(SPLASH.sprayScale * iKE * (0.30 + 0.70 * iTA));
    let foamCount  = Math.round(SPLASH.foamScale  * iTA * (0.35 + 0.65 * iKE));

    // Throttle against what is already in flight. Scaling both classes by the
    // same factor keeps the spray/foam ratio intact, so a throttled impact
    // still looks like the same KIND of impact, just thinner — which is far
    // less noticeable than dropping one class entirely or stuttering.
    if (!SPLASH.particles) { sprayCount = 0; foamCount = 0; }
    if (!SPLASH.surfaceFoam) foamCount = 0;

    const liveNow = sprayPS.particles.length + foamPS.particles.length;
    const headroom = Math.max(0, SPLASH.maxLive - liveNow);
    const wanted = sprayCount + foamCount;
    if (wanted > headroom) {
        const k = headroom / wanted;
        sprayCount = Math.floor(sprayCount * k);
        foamCount  = Math.floor(foamCount * k);
    }

    // --- the crater ---------------------------------------------------------
    //
    // Contact patch length goes as 1/sin(attack): the shallower the arrival,
    // the longer the gouge. ~2.9x at the 20 degree magic angle, floored at
    // elongMin because a patch dragged sideways is never round, and capped
    // because sin -> 0 runs away.
    const elongWant = clamp(1 / Math.max(0.05, sinA), SPLASH.elongMin, SPLASH.elongMax);
    const shape = shapeCrater(radius * SIZE, elongWant, {
        bankRad: opts.bankRad,
        aspect: opts.aspect,
        spinRPS: opts.spinRPS,
    });

    // DEPTH FROM WHAT THE WATER ACTUALLY LOST, not from a gain times an energy.
    //
    // `opts.volume` is the solver's own displaced volume for this strike, so
    // when it is there it wins: it is a measurement of the water, where energy
    // is a fact about the stone and mostly leaves again with it. A bounce that
    // retains 95% of its kinetic energy has no business making a crater sized
    // by all of it — that mismatch is why the old gain had to be 0.003 and why
    // nothing about the stone could be felt through it.
    //
    // The energy form is the fallback for callers that stop dead (Plunge), and
    // it assumes exactly that.
    const depth = SPLASH.rippleGain * (opts.volume !== undefined
        ? craterDepth(opts.volume, shape.across, shape.elong)
        : craterDepthFromEnergy(energy * sinA, shape.across, shape.elong, 0.15));
    const rippleStrength = craterDrop(x, z, depth, dirX, dirZ, shape);

    // --- spray --------------------------------------------------------------
    if (sprayCount > 0) {
        // Steep impacts throw a vertical crown, shallow ones throw a forward
        // sheet. The vertical term never reaches zero because even a pure skip
        // lifts some water.
        // radius arrives in Evan's UV space (a fraction of the pond span), but
        // the burst disc feeds particle POSITIONS, which are world metres — so
        // it is converted here. Unconverted, the disc was 8 mm across on the
        // 24 m pond: every droplet spawned from what was effectively a single
        // point, and scaling the contact patch with impact energy did nothing
        // visible.
        sprayBurst.radius = radius * SIZE * (1.0 + 2.0 * iKE);
        sprayBurst.dirX = dirX;
        sprayBurst.dirZ = dirZ;
        sprayBurst.fwd = cosA * (0.6 + 0.9 * iKE);
        sprayBurst.vert = 0.30 + 0.95 * sinA;
        sprayBurst.spread = 0.30 + 0.45 * iKE;
        // Size scales with the impact as well as count. Applied to the emitter
        // band rather than to individual particles, because shapeSpray() draws
        // a new droplet's size out of this band the frame it is recycled — so
        // this affects the burst being fired and leaves everything already in
        // the air alone.
        const grade = 1 + (SPLASH.spraySizeRange - 1) * iKE;
        sprayPS.minSize = SPLASH.spraySize[0] * grade;
        sprayPS.maxSize = SPLASH.spraySize[1] * grade;
        sprayPS.emitter.copyFromFloats(x, 0, z);
        sprayPS.minEmitPower = SPLASH.emitScale * 0.25 * speed * (0.4 + 0.6 * iKE);
        sprayPS.maxEmitPower = SPLASH.emitScale * 0.75 * speed * (0.4 + 0.6 * iKE);
        sprayPS.manualEmitCount = sprayCount;
    }

    // --- surface foam -------------------------------------------------------
    if (foamCount > 0) {
        foamBurst.radius = radius * SIZE * (1.2 + 2.5 * iTA);
        foamPS.emitter.copyFromFloats(x, 0, z);
        // Same unit conversion — foam spreading at metres-per-second would
        // cross the whole pool in a fraction of a second.
        foamPS.minEmitPower = SPLASH.emitScale * (0.05 * speed * cosA + 0.02);
        foamPS.maxEmitPower = SPLASH.emitScale * (0.22 * speed * cosA + 0.05);
        foamPS.manualEmitCount = foamCount;
    }

    return { energy, iKE, iTA, sprayCount, foamCount, rippleStrength };
}
window.stoneImpact = stoneImpact;

/**
 * CONTINUOUS DISPLACEMENT — the water reacting to a stone that is not skipping.
 *
 * stoneImpact() fires on bounces. A run is far more than its bounces: the stone
 * ploughs while it is in contact, chatters, wobbles, coasts, and finally sinks,
 * and every one of those is water being pushed out of the way.
 *
 * ### Why the first version of this did nothing at all
 *
 * It computed `ploughGain * displacedVolume * speed * dt * 60`. For a 172 g
 * stone the displaced volume is ~3e-5 m^3, so with the gain at 0.010 that
 * expression returns about 1e-6 — against a visible drop of 1e-2. Four orders
 * of magnitude, and the `< 1e-6` guard below it threw away most of the frames
 * that were left. Nothing was wrong with the idea; the expression had no units.
 *
 * ### What replaces it
 *
 * The source term for a surface wave is a volume FLUX, not a volume. A stone
 * resting in the water displaces a constant volume and makes no waves at all;
 * a stone pushing its way in displaces more of it every instant, and THAT is
 * the wave. So this tracks dV and converts it to a depth by the same
 * volume-conserving arithmetic an impact uses:
 *
 *     depth = dV / (pi * R^2 * elong * CRATER_KAPPA)
 *
 * It is signed on purpose. Water coming back as the stone lifts out is a
 * NEGATIVE crater — a mound — and it is half of what makes a wake read as
 * something moving rather than a row of dents.
 *
 * `dt` does not appear. A flux integrated over a frame is just the change over
 * that frame, so this is frame-rate independent by construction rather than by
 * a correction factor, which matters because it feeds a leaderboard's water.
 */
const plough = { lastVolume: 0 };

/** Forget the running volume — a new throw is not a continuation of the last. */
function resetDisplace() { plough.lastVolume = 0; }

/**
 * How much water the SURFACE is holding out of the way, given how deep the
 * stone is. This is the quantity waves come from, and it is not the one the
 * solver reports.
 *
 * `getDisturbance().displacedVolume` is penetration x face area — the prism the
 * stone has driven through, which keeps growing for as long as the stone keeps
 * descending. It reaches 1.6e-3 m^3 during a sink, twenty-five times the volume
 * of the stone itself, which cannot be a surface depression: by Archimedes a
 * body can only hold aside its own volume, and once it is well under the
 * surface it holds aside nothing at all, because the water has closed over it.
 *
 * So the prism is converted back to a depth and run through the shape a real
 * submergence has:
 *
 *   - rising while the stone is going under, to at most its own volume;
 *   - CLOSING again as it sinks past, over a length scale of its own radius.
 *
 * The closing half is the "dimple that shuts behind it" — not an effect added
 * on top, just what the curve does. And for the shallow contacts of an ordinary
 * skip (1-7 mm against a 10 mm stone) this returns penetration x face area
 * exactly, i.e. the solver's own number, unchanged.
 */
function surfaceVolume(displacedVolume, faceArea, thickness, effRadius) {
    if (!(faceArea > 0)) return 0;
    const depth = displacedVolume / faceArea;
    const held = Math.min(depth, thickness);
    const under = Math.max(0, depth - thickness);
    return faceArea * held * Math.exp(-under / Math.max(1e-4, effRadius));
}
window.resetDisplace = resetDisplace;

/**
 * @param d       the solver's getDisturbance()
 * @param o.dirX/dirZ  travel direction
 * @param o.spinRPS    signed spin
 * @param o.bankRad    roll, so a wobbling stone tears rather than smooths
 * @param o.aspect     the stone's own shape
 * @param o.faceArea   the stone's face area, m^2
 * @param o.thickness  the stone's thickness, m
 * @param o.effRadius  the stone's radius, m
 * @param o.resync  true on a frame that already fired an impact, so the same
 *        water is not charged for twice
 */
function stoneDisplace(d, o) {
    const vol = surfaceVolume(d.displacedVolume, o.faceArea, o.thickness, o.effRadius);
    const dV = vol - plough.lastVolume;
    plough.lastVolume = vol;

    // A bounce already queued its own crater from this same volume. Take the
    // new baseline and emit nothing.
    if (o.resync || !SPLASH.ploughGain) return 0;
    if (Math.abs(dV) < 1e-9) return 0;

    // A FURROW ONLY EXISTS IF SOMETHING IS MOVING. Ploughing at speed leaves a
    // long scar; a stone settling in place leaves a round dimple, because
    // there is no direction for it to be long in. Interpolating on speed is
    // what makes the sink read as a sink rather than as a very slow gouge.
    const run = clamp01(d.speed / 3);
    const elongWant = 1 + (SPLASH.ploughElong - 1) * run;
    const shape = shapeCrater(d.radius, elongWant, o);
    const depth = SPLASH.ploughGain * craterDepth(dV, shape.across, shape.elong);
    return craterDrop(d.x, d.z, depth, o.dirX, o.dirZ, shape);
}
window.stoneDisplace = stoneDisplace;

/**
 * GROUND EFFECT — the dimple a stone drags under itself between bounces.
 *
 * A flat plate moving fast a few millimetres above water rides on a cushion of
 * air it cannot get out of the way in time, and that cushion presses the
 * surface down. It is the same mechanism that lets the stone plane at all, and
 * it is the reason a real run reads as one continuous event: there is a moving
 * pressure source travelling between the impacts, and a moving pressure source
 * is what draws a wake.
 *
 * Depth is stagnation pressure over rho_w * g — the height of water that
 * pressure holds up — attenuated by gap. The cubic falloff is not derived; the
 * fraction of stagnation pressure that reaches the surface at a given gap
 * depends on the flow under the plate, which this page does not solve. That is
 * what SPLASH.groundEffect is for, and why it is a slider.
 *
 * @param gap  height of the stone above the LOCAL water surface, metres
 */
function stoneGroundEffect(x, z, gap, speed, effRadius, o) {
    const g = SPLASH.groundEffect;
    if (!g || gap <= 0 || speed < 1) return 0;
    const reach = SPLASH.groundEffectRadii * effRadius;
    if (gap >= reach) return 0;
    const atten = Math.pow(effRadius / (effRadius + gap), 3);
    const localDepth = (0.5 * RHO_A * speed * speed) / (RHO_W * GRAV);
    const volume = g * localDepth * atten * Math.PI * effRadius * effRadius;
    const shape = shapeCrater(effRadius, SPLASH.ploughElong, o);
    return craterDrop(x, z, craterDepth(volume, shape.across, shape.elong),
        o.dirX, o.dirZ, shape);
}
window.stoneGroundEffect = stoneGroundEffect;

// Tuning panel. Declarative so a new knob is one line — each control reads and
// writes the live value directly, meaning nothing here can drift out of sync
// with what the sim is actually using.
// =============================================================================
// =============================================================================
// Scribble / crayon post-process — an experiment, off by default.
//
// This runs on the FINAL composited image, after the tone-mapping pipeline. The
// ordering is load-bearing: the ink colour and paper wash below are ordinary
// low-dynamic-range constants, and applying them to the linear HDR values the
// water shader outputs would be meaningless. Attaching after the pipeline is
// what puts it in the space those numbers assume.
//
// Everything is created lazily on first enable, because the depth renderer it
// needs is a whole extra pass over the scene and should not be paid for while
// the effect is off.
// =============================================================================
const SCRIBBLE = window.SCRIBBLE = {
    on: true,
    // Colour bleed and warp stay 0 — bleed was the camera-locked swimming.
    bleed: 0.0,
    warp: 0.0,
    // Pastel. Defaults re-tuned 2026-08-04 to the universal look the user
    // dialled in on the shared cross-lab panel (superseding this file's
    // original tuning) — keep in step with shared/scribble-dials.js.

    strokeAmount: 0.02,

    strokeAngle: 0.5,

    edgeDark: 0.0,

    // reads as an error rather than as a medium.

    skyDepth: 0.999,
};

// SEAMLESS value noise. The obvious version — draw a small random canvas and
// let the browser scale it up — produces a texture whose left edge does not
// match its right. Sampled with WRAP at 3x and 5x repeats, as the warp and
// bleed below do, every repeat boundary becomes a hard jump in the DISPLACEMENT,
// which slices the frame into offset rectangles. Two different repeat rates
// overlaid give a grid of them, and that was the tiling on screen.
//
// Building it from a lattice indexed with modulo makes it genuinely tileable,
// so any repeat rate stays continuous.
function makeNoiseTex(cells, smooth, name) {
    const S = 256;
    const t = new BABYLON.DynamicTexture(name, { width: S, height: S }, scene, false);
    const ctx = t.getContext();
    const img = ctx.createImageData(S, S);
    const lat = new Float32Array(cells * cells);
    // AUDIT #A6: seeded (was Math.random) so the paper grain is identical
    // every session and across every lab page - share cards stay pixel-
    // reproducible. Seed folds in `cells` so flow and grain differ.
    let _s = (0x9e3779b9 ^ (cells * 2654435761)) >>> 0;
    const _rand = () => ((_s = (_s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < lat.length; i++) lat[i] = _rand();
    const wrap = (v) => ((v % cells) + cells) % cells;
    const at = (x, y) => lat[wrap(y) * cells + wrap(x)];

    for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
            const fx = x / S * cells, fy = y / S * cells;
            const x0 = Math.floor(fx), y0 = Math.floor(fy);
            let v;
            if (smooth) {
                let tx = fx - x0, ty = fy - y0;
                tx = tx * tx * (3 - 2 * tx);
                ty = ty * ty * (3 - 2 * ty);
                const a = at(x0, y0), b = at(x0 + 1, y0);
                const c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
                v = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
            } else {
                v = at(x0, y0);
            }
            const o = ((y * S) + x) * 4;
            const b8 = Math.max(0, Math.min(255, v * 255)) | 0;
            img.data[o] = img.data[o + 1] = img.data[o + 2] = b8;
            img.data[o + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    t.update(false);
    t.wrapU = t.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    return t;
}

BABYLON.Effect.ShadersStore["scribbleFragmentShader"] = glsl(`
precision highp float;
varying vec2 vUV;
uniform sampler2D textureSampler;
uniform sampler2D depthSampler;
uniform sampler2D flowSampler;
uniform sampler2D grainSampler;
uniform vec2 texelSize;
uniform float outlineWidth;
uniform float bleed;
uniform float warpAmount;
uniform float paperScale;
uniform float grainAmount;
uniform float levels;        // value steps, the core pastel control
uniform float satAmount;     // 1 keeps scene saturation, lower is chalkier
uniform float strokeAmount;  // pigment stroke visibility
uniform float strokeFreq;    // stroke density across their direction
uniform float strokeAngle;   // stroke direction, radians
uniform float edgeDark;      // how much edges deepen, 0 removes them
uniform float ignoreSky;     // 1 leaves the HDRI background untouched
uniform float skyDepth;      // depth at or beyond which a pixel is background

float depthAt(vec2 uv) { return texture2D(depthSampler, uv).r; }

void main(void) {
    // Displacement is OFF by default now. Warping the image by a screen-space
    // noise is the shower-door artefact: the distortion is pinned to the screen
    // while the scene slides underneath it, so surfaces appear to swim through
    // a fixed pane of rippled glass whenever the camera moves. Pastel does not
    // need it — the medium reads through value steps, pigment and tooth, not
    // through warping — so both terms are kept only as optional extras.
    // Kept untouched so the sky can be handed back unstyled at the end.
    vec3 raw = texture2D(textureSampler, vUV).rgb;

    vec2 uv = vUV;
    if (warpAmount > 0.0) {
        vec2 wv = (texture2D(flowSampler, vUV * 3.0).rg - 0.5) * 2.0;
        uv += wv * warpAmount;
    }
    vec3 color = texture2D(textureSampler, uv).rgb;
    if (bleed > 0.0) {
        vec2 bv = (texture2D(flowSampler, vUV * 5.0 + 0.37).rg - 0.5) * 2.0;
        color = texture2D(textureSampler, uv + bv * bleed).rgb;
    }

    // --- the pastel move: quantise VALUE, keep hue -------------------------
    // Pigment laid by hand does not hold a smooth gradient. It goes down in
    // discrete layers, so tone steps while colour stays continuous. Quantising
    // luminance and rescaling the colour to match does exactly that, whereas
    // quantising the channels separately would swing the hue at every step.
    float lum = dot(color, vec3(0.299, 0.587, 0.114));
    float q = floor(lum * levels + 0.5) / levels;
    color *= q / max(lum, 1e-4);

    // Chalky rather than saturated. Pastel sits lighter and duller than the
    // scene it depicts, because pigment is opaque and scatters.
    float lum2 = dot(color, vec3(0.299, 0.587, 0.114));
    color = mix(vec3(lum2), color, satAmount);

    // --- pigment strokes ----------------------------------------------------
    // Sampled ANISOTROPICALLY: low frequency along the stroke direction, high
    // across it, which turns isotropic noise into streaks that read as a
    // loaded stick dragged over the surface.
    vec2 sd = vec2(cos(strokeAngle), sin(strokeAngle));
    vec2 sp = vec2(dot(vUV, sd), dot(vUV, vec2(-sd.y, sd.x)));
    float stroke = texture2D(flowSampler, vec2(sp.x * strokeFreq * 0.12,
                                               sp.y * strokeFreq)).r;
    color *= mix(1.0, 0.55 + 0.9 * stroke, strokeAmount);

    // --- edges --------------------------------------------------------------
    // Darkened with the surface's OWN colour rather than stamped with ink.
    // Pastel has no pen: an edge is where pigment piles up, so it reads as a
    // deeper version of the local hue instead of a black line over it.
    /* AUDIT #6: edgeDark ships at 0.0, and these four full-res depth taps were
       being fetched and multiplied by zero every pixel. Branch is uniform, so
       it costs nothing when off. */
    if (edgeDark > 0.0) {
        vec2 ox = vec2(texelSize.x, 0.0) * outlineWidth;
        vec2 oy = vec2(0.0, texelSize.y) * outlineWidth;
        float edge = abs(depthAt(vUV - ox) - depthAt(vUV + ox))
                   + abs(depthAt(vUV - oy) - depthAt(vUV + oy));
        float line = smoothstep(0.003, 0.02, edge);
        color = mix(color, color * 0.35, line * edgeDark);
    }

    // Paper tooth stays SCREEN-locked, and that is correct: the paper is a
    // fixed sheet the scene is drawn onto, so it should not travel with the
    // geometry. Only displacement had to stop doing that.
    float paper = texture2D(grainSampler, vUV * paperScale).r;
    color *= mix(1.0, paper, grainAmount);
    color = mix(color, color * vec3(1.06, 1.0, 0.90), 0.5);

    // Hand the HDRI background back untouched. The sky sits at exactly the far
    // depth value while all real geometry is well below it (measured: sky 1.0,
    // scene 0.001-0.30), so the depth buffer separates them cleanly with no
    // extra pass or stencil. Worth doing because a photographic sky put through
    // value quantisation and paper tooth stops reading as sky and starts
    // reading as a mistake.
    float styled = 1.0;
    if (ignoreSky > 0.5) styled = 1.0 - step(skyDepth, depthAt(vUV));
    gl_FragColor = vec4(mix(raw, color, styled), 1.0);
}
`);

let scribblePP = null, scribbleDepth = null, flowTex = null, grainTex = null;

function setScribble(on) {
    SCRIBBLE.on = on;
    if (on) {
        if (!flowTex) {
            flowTex = makeNoiseTex(16, true, "scribbleFlow");
            grainTex = makeNoiseTex(256, false, "scribbleGrain");
        }
        if (!scribbleDepth) scribbleDepth = scene.enableDepthRenderer(camera, false);
        if (!scribblePP) {
            scribblePP = new BABYLON.PostProcess("scribble", "scribble",
                ["texelSize", "outlineWidth", "bleed", "warpAmount", "paperScale", "grainAmount",
                 "levels", "satAmount", "strokeAmount", "strokeFreq", "strokeAngle", "edgeDark",
                 "ignoreSky", "skyDepth"],
                ["depthSampler", "flowSampler", "grainSampler"],
                1.0, camera);
            scribblePP.onApply = (eff) => {
                eff.setTexture("depthSampler", scribbleDepth.getDepthMap());
                eff.setTexture("flowSampler", flowTex);
                eff.setTexture("grainSampler", grainTex);
                eff.setFloat2("texelSize", 1 / engine.getRenderWidth(), 1 / engine.getRenderHeight());
                eff.setFloat("outlineWidth", SCRIBBLE.outlineWidth);
                eff.setFloat("bleed", SCRIBBLE.bleed);
                eff.setFloat("warpAmount", SCRIBBLE.warp);
                eff.setFloat("paperScale", SCRIBBLE.paperScale);
                eff.setFloat("grainAmount", SCRIBBLE.grain);
                eff.setFloat("levels", SCRIBBLE.levels);
                eff.setFloat("satAmount", SCRIBBLE.satAmount);
                eff.setFloat("strokeAmount", SCRIBBLE.strokeAmount);
                eff.setFloat("strokeFreq", SCRIBBLE.strokeFreq);
                eff.setFloat("strokeAngle", SCRIBBLE.strokeAngle);
                eff.setFloat("edgeDark", SCRIBBLE.edgeDark);
                eff.setFloat("ignoreSky", SCRIBBLE.ignoreSky ? 1 : 0);
                eff.setFloat("skyDepth", SCRIBBLE.skyDepth);
            };
        }
    } else {
        if (scribblePP) { scribblePP.dispose(camera); scribblePP = null; }
        if (scribbleDepth && scene.disableDepthRenderer) {
            scene.disableDepthRenderer(camera);
            scribbleDepth = null;
        }
    }
}

// Shared scribble store — the labs hub keeps dialled-in values in a localhost
// cookie (browsers scope cookies by host, not port, so every lab page shares
// the jar). Only keys the user has touched exist in the store, and only those
// are applied, so this file's own tuning stays authoritative until a dial
// moves. Runs BEFORE the panel below is built, so its sliders seat on the
// carried-over values; the write-back listener at the bottom of this block
// stores only values that changed from this boot's baseline.
const SCRIB_STORE = (() => {
    const read = () => {
        try {
            const m = document.cookie.match(/(?:^|;\s*)rockgame_scribble=([^;]*)/);
            if (m) return JSON.parse(decodeURIComponent(m[1]));
        } catch (e) { /* unreadable store — treat as empty */ }
        return {};
    };
    const write = (patch) => {
        try {
            document.cookie = "rockgame_scribble=" +
                encodeURIComponent(JSON.stringify(Object.assign(read(), patch))) +
                "; path=/; max-age=31536000; SameSite=Lax";
        } catch (e) { /* cookie jar closed — dial-in just won't carry */ }
    };
    return { read, write };
})();

(function applySharedScribble() {
    const stored = SCRIB_STORE.read();
    const apply = {
        on:            (v) => SCRIBBLE.on = v > 0.5,
        levels:        (v) => SCRIBBLE.levels = v,
        satAmount:     (v) => SCRIBBLE.satAmount = v,
        strokeAmount:  (v) => SCRIBBLE.strokeAmount = v,
        strokeFreq:    (v) => SCRIBBLE.strokeFreq = v,
        strokeAngle:   (v) => SCRIBBLE.strokeAngle = v,
        paperScale:    (v) => SCRIBBLE.paperScale = v,
        grain:         (v) => SCRIBBLE.grain = v,
        bleed:         (v) => SCRIBBLE.bleed = v,
        warp:          (v) => SCRIBBLE.warp = v,
        ignoreSky:     (v) => SCRIBBLE.ignoreSky = v > 0.5,
        skyDepth:      (v) => SCRIBBLE.skyDepth = v,
        exposure:      (v) => pipeline.imageProcessing.exposure = v,
        warmth:        (v) => curves.globalDensity = v,
        warmthHue:     (v) => curves.globalHue = v,
        envSaturation: (v) => curves.globalSaturation = v,
    };
    for (const k in apply) {
        if (k in stored) { try { apply[k](Number(stored[k])); } catch (e) { console.warn("scribble store:", k, e); } }
    }

    const snapshot = () => ({
        on: SCRIBBLE.on ? 1 : 0, levels: SCRIBBLE.levels,
        satAmount: SCRIBBLE.satAmount, strokeAmount: SCRIBBLE.strokeAmount,
        strokeFreq: SCRIBBLE.strokeFreq, strokeAngle: SCRIBBLE.strokeAngle,
        paperScale: SCRIBBLE.paperScale, grain: SCRIBBLE.grain,
        bleed: SCRIBBLE.bleed, warp: SCRIBBLE.warp,
        ignoreSky: SCRIBBLE.ignoreSky ? 1 : 0, skyDepth: SCRIBBLE.skyDepth,
        exposure: pipeline.imageProcessing.exposure,
        warmth: curves.globalDensity, warmthHue: curves.globalHue,
        envSaturation: curves.globalSaturation,
    });
    const base = snapshot();
    let t = null;
    document.getElementById("panel").addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => {
            const now = snapshot(), diff = {};
            for (const k in now) if (now[k] !== base[k]) diff[k] = now[k];
            Object.assign(base, diff);
            if (Object.keys(diff).length) SCRIB_STORE.write(diff);
        }, 200);
    });
})();

(function buildPanel() {

            h.textContent = c[0];

        }

        const lab = document.createElement("div");

        };

    const btns = document.createElement("div");
    btns.className = "btns";

    const plungeBtn2 = document.createElement("button");

    out.id = "copyOut";
    out.readOnly = true;
    panel.appendChild(out);

    copyBtn.addEventListener("click", async () => {
        const lines = ["water tuning",
            "window " + SIZE + "m  RES " + RES + "  cell " + (CELL * 1000).toFixed(1) + "mm",
            "STEPS " + STEPS + "  WAVE_C " + WAVE_C.toFixed(3)];

            if (c[1] === null) { lines.push("", "[" + c[0] + "]"); continue; }
            const v = c[1]();
            lines.push("  " + c[0] + " = " + (Math.abs(v) < 1 ? v.toFixed(4) : v.toFixed(2)));
        }
        const text = lines.join("\n");
        // Clipboard can be blocked depending on focus and permissions, so the
        // textarea is a guaranteed fallback rather than an error message.
        let ok = false;
        try {
            await navigator.clipboard.writeText(text);
            ok = true;
        } catch (e) { ok = false; }

let primed = false;
let frame = 0;

// Scratch for the per-frame uniform update. One Vector2 per frame is a small
// allocation, but it is garbage created sixty times a second for no reason.
const _windDir = new BABYLON.Vector2(1, 0);

scene.registerBeforeRender(() => {
    // Defensive: the particle pass leaves the depth function disabled, and the
    // opaque geometry drawn below depends on it being back to normal.
    engine.setDepthFunction(DEPTH_LEQUAL);
    retireSubmerged();

    waterMat.setVector3("cameraPos", camera.position);
    waterMat.setFloat("time", performance.now() * 0.001);
    waterMat.setFloat("windStrength", WIND.strength);
    const wr = WIND.dirDeg * Math.PI / 180;
    _windDir.copyFromFloats(Math.cos(wr), Math.sin(wr));
    waterMat.setVector2("windDir", _windDir);
    waterMat.setFloat("detailScale", WIND.detail);
    waterMat.setFloat("waveScale", WIND.waveScale);
    waterMat.setFloat("blurGain", WIND.blurGain);
    waterMat.setVector2("windowCenter", windowCenter);

    // The effects compile asynchronously, so priming retries until it takes.
    if (!primed) {
        primed = reset();
        if (!primed) return;
    }
    if (needsSeed && updatePass.effect.isReady()) { seed(); needsSeed = false; lastDisturb = performance.now(); }
    if (paused) { waterMat.setTexture("sim", simA); return; }

    if (raining && (frame % 14 === 0)) {
        queueDrop(windowCenter.x + (Math.random() * 2 - 1) * HALF * 0.9,
                  windowCenter.y + (Math.random() * 2 - 1) * HALF * 0.9, DROP_S);
    }
    frame++;

    // Drops first, each its own pass, exactly as his addDrop works. The
    // readiness peek matters on the opening frames: runPass silently no-ops
    // while the drop effect is still compiling, and a drop shifted off the
    // queue at that moment would be lost rather than retried — the 20-drop
    // opening seed could vanish that way.
    recenterWindow();

    while (dropQueue.length && dropPass.effect.isReady()) {
        dropsInBatch = 0;
        while (dropQueue.length && dropsInBatch < DROP_BATCH) {
            const d = dropQueue.shift();
            // d.z, not d.y — the queue stores the pond's x/z plane. Reading
            // d.y here silently killed every drop in the project once.
            //
            // World → window [-1, 1], against THIS frame's centre. A drop
            // outside the window (a droplet landing behind a fast run) is
            // skipped — the deviation field it would write into does not
            // exist out there.
            const cx = (d.x - windowCenter.x) / HALF;
            const cz = (d.z - windowCenter.y) / HALF;
            if (Math.abs(cx) > 0.92 || Math.abs(cz) > 0.92) continue;
            const o = dropsInBatch * 4;
            dropData[o] = cx; dropData[o + 1] = cz;
            dropData[o + 2] = d.radius; dropData[o + 3] = d.strength;
            // Direction is a world vector; the crater lives in window UV, whose
            // axes are the same orientation, so it carries over unrotated.
            const dl = Math.hypot(d.dirX, d.dirZ) || 1;
            dropAxisData[o] = d.dirX / dl; dropAxisData[o + 1] = d.dirZ / dl;
            dropAxisData[o + 2] = d.elong; dropAxisData[o + 3] = d.skew;
            dropsInBatch++;
        }
        // One pass applies the whole batch — bit-identical to the old
        // pass-per-drop, because drop writes are pure additions.
        if (dropsInBatch > 0) runPass(dropPass);
    }

    // Then his per-frame loop: two simulation steps, one normal pass.
    //
    // AUDIT #6 (docs/10 pausability): the deviation sim used to step
    // unconditionally — ~64 MB/frame of RGBA32F traffic with nothing moving.
    // The ambient waves are analytic in the water material, so the ping-pong
    // field only carries drops and ripples; once the last disturbance is
    // settleMs() old the damping has flattened it and there is nothing left to
    // integrate. Freeze the passes, keep the texture bound and rendered —
    // the same shape as sand-sim's deformation gate.
    if (performance.now() - lastDisturb < settleMs()) {
        for (let i = 0; i < STEPS; i++) stepSimulation();
        updateNormals();
    }

    waterMat.setTexture("sim", simA);
});

engine.runRenderLoop(() => scene.render());
addEventListener("resize", () => engine.resize());
