<!-- Babylon is PINNED. It used to be cdn.babylonjs.com/babylon.js, which serves
     *latest* — this page could change behaviour overnight with no commit, which is
     not a property a game whose leaderboard promises "identical inputs, identical
     results" can have. The version tracks @babylonjs/core in the workspace root;
     bump both together. tools/pinned-cdn-check.mjs fails the build if this reverts
     to an unpinned URL. -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.18.0/babylon.js"></script>
<script>
// =============================================================================
// Height-field water — a direct port of Evan Wallace's WebGL Water simulation.
//
//   WebGL Water
//   http://madebyevan.com/webgl-water/
//   Copyright 2011 Evan Wallace
//   Released under the MIT license
//
// The four simulation shaders below (clear/drop/update/normal) are his, ported
// verbatim apart from the mechanical changes needed to run them under Babylon
// rather than lightgl: his "coord" varying is Babylon's vUV, his "texture"
// sampler is named "prev", and the GLSL is plain strings instead of lightgl's
// backslash-continued ones. The maths is untouched.
//
// His constants are used as-is and are load-bearing, not arbitrary — they are
// tuned to each other:
//   256x256 sim texture, 2x2 world plane (x and z in [-1, 1])
//   0.995 velocity damping per step
//   2 simulation steps + 1 normal pass per frame
//   drop radius 0.03, strength 0.01
// Changing the plane size or resolution without rescaling the rest changes how
// the water behaves, not just how detailed it is, because his normal shader
// treats UV space as world space.
//
// The texture layout is his: (height, velocity, normal.x, normal.z). All four
// channels are occupied, which is why the surface shader reads its normal out
// of the texture rather than recomputing a gradient.
//
// What is NOT ported, both deliberately: the refraction/IOR path from his
// fragment shader (this project is reflection-only from the outset) and his
// sphere volume-displacement shader (object interaction comes later, driven by
// the stone's own physics).
// =============================================================================

// Scaled up from his 2 m pool to pond size. RES, SIZE and STEPS are COUPLED and
// cannot be changed independently: a wave crosses one cell per step, so
//     waveSpeed = (SIZE / RES) * 0.551 * STEPS * 60
// (the cells-per-step figure is measured, not theoretical: 0.694 at Wallace's
// WAVE_C 2.0, 0.551 at the 1.5 this now uses — see WAVE_C for why). Real ripples of the
// size a stone makes travel 0.7-1.0 m/s by deep-water dispersion, and that pins
// the cell size to roughly 25 mm. Everything below follows from that:
//
//   SIZE 64 m / RES 1024  ->  62.5 mm cells
//   STEPS 1, WAVE_C 0.087 ->  0.78 m/s waves, inside the physical 0.7-1.0 band
//
// WAVE_C is now DERIVED from that relation rather than typed, so `?res=2048`
// re-solves it instead of silently doubling the wave speed. See WAVE_C.
//
// SIZE went 24 -> 64 to hold a WHOLE RUN's ripples at once (see placeWindow).
// That is free in memory and bandwidth — RES is unchanged, so it is the same
// 1024^2 pair — and is paid for in cell size, which is bought back with WAVE_C.
// The earlier note here that "48 m at this cell size needs 2048^2" was assuming
// the cell size had to stay fixed. It does not; the wave speed does.
//   damping rescaled      ->  0.995 was per-step at 2 steps/frame, so halving
//                             the step count needs 0.995^2 to decay the same
//                             amount per second
//
// Going much beyond 24 m means either waves that travel visibly too fast or a
// texture that will not fit in memory (48 m at this cell size needs 2048^2,
// about 134 MB across the ping-pong pair). That is what the WINDOWED SIM (now
// implemented, audit #8) solves: the deviation field lives in a 24 m window
// that follows the interaction — recentred by whole texels via a scroll pass,
// so nothing resamples — while the pond itself is POND metres of analytic
// ambient, which is continuous everywhere and needs no memory. The deviation
// fades to zero at the window edge, and what remains is ambient, so there is
// no join to hide. A skip run's ripples ride along with the stone.
/**
 * Simulation texture size. `?res=2048` to A/B it.
 *
 * THIS IS THE KNOB THAT DECIDES HOW A RIPPLE READS, and it is worth
 * understanding why before touching anything else.
 *
 * A stone's real contact patch is 3-15 cm^2 — a tenth of one 62.5 mm cell. The
 * grid cannot represent it, so a crater is band-limited to MIN_DROP_CELLS
 * across and its depth drops to keep the volume honest. That trade is quadratic
 * in cell size: at RES 2048 the same displaced volume gets a crater a quarter
 * the area and FOUR TIMES the depth. Nothing else on this page moves ripple
 * amplitude that far.
 *
 * It is not free. The ping-pong pair is RGBA32F, so 1024 costs 33 MB and 2048
 * costs 134 MB, on a floor machine (docs/10) whose GPU memory is shared with
 * the system. 2048 is the default because at 1024 the champion throw's hardest
 * bounce is a 0.5 mm crater and most of its run is under 0.1 mm — physically
 * honest, and under what the surface shader can show. `?res=1024` is the
 * fallback, and the A/B belongs on the 2020 MacBook rather than in this
 * comment.
 */
const RES = (() => {
    const q = Number(new URLSearchParams(location.search).get("res"));
    return [512, 1024, 2048].includes(q) ? q : 2048;
})();
const SIZE    = 64;      // interaction WINDOW span in metres (was the whole pond)
const HALF    = SIZE / 2;
// The pond the player sees. docs/01 asks for ~200 m "pending feasibility
// check against the water sim" — the windowed sim IS that feasibility
// answer. game-profile throws run ~61 m, arcade ~115 m; both now land on
// water. Ambient waves are analytic so the only cost of the extra span is
// mesh area.
const POND      = 200;
const POND_HALF = POND / 2;
const SUBDIV  = 192;     // surface tessellation. 256 gave 65k verts every frame;
                         // the two shortest ambient octaves are normal-only
                         // anyway, so the geometry was carrying detail it could
                         // not resolve.
const STEPS   = 1;       // stepSimulation() calls per frame
// RIPPLE PERSISTENCE. Wallace's 0.995 (0.990 rescaled for STEPS 1) was tuned
// for a 2 m demo pool, where a ripple crossing the pool and dying inside a
// second looks right. At 24 m with a stone skipping for five seconds it meant
// every ripple was gone before the run was: 55% amplitude after 1 s, 16% after
// 3 s, 2.7% after 6 s. The trail vanished behind the stone.
//
// This is NOT what the pausability gate did — that only freezes the field once
// it is already flat, and the STEPS 2 -> 1 change was explicitly rescaled to
// keep the per-second decay identical. The constant was simply inherited.
//
// At 0.9992 a ripple is still at 62% after 10 s and 24% after 30 s. Numerically
// safe: a twin of the update shader stays bounded all the way to 1.0 (no
// damping at all), so this is a look knob, not a stability one.
const RIPPLE = window.RIPPLE = { damping: 0.9992 };

/**
 * THE SKIP LAB's parameters — the stone-skipping demo's controls, now living on
 * this page.
 *
 * Plain numbers, declared in this CLASSIC script so the tuning panel below can
 * bind to them the same way it binds to WIND and RIPPLE. The solver itself is an
 * ES module and cannot be imported here, so it is loaded in a module block at
 * the foot of the page and reads these values at throw time. That split is the
 * whole trick: data here, physics there, one panel over both.
 *
 * `profile` and `preset` are names; the module resolves them against
 * PHYSICS_PROFILES and THROW_PRESETS. `assist` starts empty and is filled from
 * the chosen profile by the module, so a stale literal here can never silently
 * override a profile — which is a bug this project has now shipped twice.
 */
const SKIP = window.SKIP = {
    profile: "game",
    preset: "steinerThrow",
    throw: {
        speed: 19.2, elevationDeg: -2, attackAngleDeg: 20, spinRPS: 47,
        bankAngleDeg: 0, spinAxisTiltDeg: 0, releaseHeight: 0.12,
    },
    stone: { radius: 0.045, thickness: 0.010, aspect: 1.0 },
    assist: {},
    follow: true,
    slow: false,
    /** Installed by the module block once the solver has loaded. */
    doThrow: null,
};

/**
 * Wave coefficient in the update step: v += (average - h) * WAVE_C.
 *
 * Wallace's 2.0 sits exactly AT this scheme's CFL limit, and that is not a
 * safety margin — it is the edge. For the checkerboard mode (alternating every
 * texel) the 4-neighbour average is exactly -h, so the update becomes
 * v' = damp*(v - 2*C*h); at C = 2 the eigenvalues are a DEFECTIVE double root at
 * -1, which grows like n*lambda^n before it decays.
 *
 * It grows at EVERY damping value, including the original 0.990 — measured peak
 * 13x over 600 steps. The old code got away with it because damping killed the
 * amplitude long before the growth was visible. Raise the damping to make
 * ripples last, and the same mode reaches 49x and shows up as a full-screen
 * two-pixel hatch. That is a real regression this file shipped, and it is why
 * this constant is now named and tested rather than inlined.
 *
 * Backing off it buys the margin: well below 2.0 the mode stays bounded at ~1x
 * for any damping, so RIPPLE.damping is genuinely free to dial.
 *
 * The value is not chosen for stability alone — it is what holds the wave speed
 * at 0.78 m/s now that SIZE is 64 m and a cell is 62.5 mm. Cell size and WAVE_C
 * trade directly: a wider window means bigger cells, and a lower WAVE_C slows
 * the wave back down to the physical 0.7-1.0 m/s band. Change one, re-derive
 * the other; scheme-stability-check.mjs fails if the pair drifts out of band.
 *
 * tools/scheme-stability-check.mjs asserts both halves of that on every test run.
 */
/**
 * Ripples of the size a stone makes travel 0.7-1.0 m/s by deep-water
 * dispersion. This is the number WAVE_C exists to hit.
 */
const WAVE_SPEED = 0.78;
/**
 * DERIVED, not typed. In the small-C limit the update step is a discrete wave
 * equation whose speed is sqrt(WAVE_C / 2) cells per step — measured 0.208
 * against a predicted 0.212 at the value this page shipped — so
 *
 *     WAVE_C = 2 * (WAVE_SPEED / (cell * STEPS * 60))^2
 *
 * Deriving it is what lets RES be a URL flag at all. Cell size and wave speed
 * trade directly, and the pair had already been got wrong once by hand: raising
 * the damping at Wallace's WAVE_C 2.0 amplified the grid-scale mode 49x and
 * rendered as a full-screen two-pixel hatch across the pond. A literal here is
 * a value someone has to remember to re-derive, and this file is the evidence
 * that nobody does.
 *
 * The approximation is only good well below the CFL limit, which is exactly
 * where this needs to be anyway; scheme-stability-check.mjs re-measures the
 * true wave speed from the scheme and fails if it leaves the physical band.
 */
const WAVE_C = 2 * Math.pow(WAVE_SPEED / ((SIZE / RES) * STEPS * 60), 2);
const DROP_R  = 0.2 / SIZE;  // 0.2 m impact crater, expressed in UV
const DROP_S  = 0.01;    // his drop strength, in metres of displacement
/** One simulation cell, in metres. 62.5 mm at SIZE 64 / RES 1024. */
const CELL = SIZE / RES;

// --- turning a displaced VOLUME into a crater depth --------------------------
//
// THE UNIT PROBLEM THIS SOLVES. Every ripple on this page used to be a hand-set
// "strength" in metres, tuned by eye against Wallace's 0.01. That is why the
// stone's own numbers could not drive it: `ploughGain * displacedVolume * ...`
// multiplied a gain by a raw m^3, which for a 172 g stone is ~1e-5, and landed
// four orders of magnitude below anything visible. The knob was not too small —
// the equation had no units.
//
// A crater is a VOLUME of water moved. The solver knows that volume exactly, so
// the conversion is arithmetic, not taste:
//
//     depth = volume / (pi * R^2 * elongation * CRATER_KAPPA)
//
// CRATER_KAPPA is the mean of the shader's radial profile over its own disc,
// integral(0..1) w(u) * 2u du with w(u) = 0.5 - 0.5*cos(pi*(1-u)), which is
// exactly 0.5 - 2/pi^2. Any R gives the same volume, which is the point: R is
// chosen for LEGIBILITY and the depth follows.
const CRATER_KAPPA = 0.5 - 2 / (Math.PI * Math.PI);   // 0.29736
/**
 * Smallest crater the grid can carry, in cells.
 *
 * A real skipping-stone contact patch is 3-15 cm^2 — under a tenth of one 62.5
 * mm cell. Stamping it at true size writes a single texel, which is not a
 * ripple, it is noise: the scheme cannot propagate anything shorter than a few
 * cells, so the energy goes straight into the grid-scale mode the stability
 * check exists to keep out.
 *
 * So the crater is band-limited to what the grid can actually represent, and
 * volume is conserved while it is widened. That is an honest statement of the
 * sim's resolution, not a fudge — and it is the single reason RES matters to
 * how these read. At RES 2048 the same volume gets a crater a quarter the area
 * and four times the depth.
 */
const MIN_DROP_CELLS = 3;
const MIN_DROP_R = (MIN_DROP_CELLS * CELL) / SIZE;   // in Evan's UV
/**
 * Rim height, as a multiple of crater depth, that makes a drop VOLUME-NEUTRAL.
 *
 * Water is incompressible: what leaves the hole has to go somewhere, and it
 * goes into a ring around it. The annulus profile sin^2(pi*u) integrates to 0.5
 * over its disc against the crater lobe's CRATER_KAPPA, so this ratio is what
 * makes the two cancel exactly.
 *
 * Not cosmetic. A pure Wallace bump adds height to the pond every time it
 * fires, and at damping 0.9992 — ripples that never clear, by design — a run
 * with fifty bounces would leave a standing mound behind. Zero net volume means
 * the mean level cannot drift however long the field runs.
 */
const RIM_NEUTRAL = CRATER_KAPPA / 0.5;   // 0.59472

// Babylon's shader processor rewrites the source it is handed and mishandles a
// line comment containing a semicolon, leaving the tail of the sentence in the
// compiled GLSL as a syntax error. Stripping comments on the way to the
// compiler sidesteps that; they stay in this file, where they are useful.
const glsl = (src) => src.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/[^\n]*/g, "");

// --- Evan Wallace's simulation shaders ---------------------------------------

// Not his — a plain clear, since lightgl could blank a texture directly and
// EffectRenderer has no equivalent.
const CLEAR_FRAG = `
precision highp float;
varying vec2 vUV;
void main(void) {
    gl_FragColor = vec4(0.0);
}
`;

// His dropShader, batched (audit #B4). Every queued drop used to be its own
// fullscreen pass — up to 13 per frame during a skip run, ~420 MB of texture
// traffic. Drop writes are pure additions into the height channel, so they
// are order-independent and a batch of N applied in one pass is bit-identical
// to N sequential passes. 16 slots covers every real frame; overflow just
// runs the pass again.
const DROP_BATCH = 16;
const DROP_FRAG = `
precision highp float;
const float PI = 3.141592653589793;
varying vec2 vUV;
uniform sampler2D prev;
uniform float dropCount;
uniform vec4 drops[${DROP_BATCH}];   /* center.xy in [-1,1], radius, depth */
/* travel direction .xy (unit, window space), elongation .z, lateral skew .w */
uniform vec4 dropAxis[${DROP_BATCH}];
/* Rim height as a multiple of crater depth. RIM_NEUTRAL makes a drop displace
   zero net volume; 0 restores Wallace's plain bump. One value for the whole
   batch — it is a property of how this page models a splash, not of any one
   splash. */
uniform float dropRim;
void main(void) {
    vec4 info = texture2D(prev, vUV);
    for (int i = 0; i < ${DROP_BATCH}; i++) {
        if (float(i) >= dropCount) break;
        vec4 d = drops[i];
        vec4 ax = dropAxis[i];
        vec2 rel = (d.xy * 0.5 + 0.5) - vUV;

        /* AN OBLIQUE IMPACT GOUGES A TRACK, NOT A CIRCLE.
           A circular crater is what a stationary drop makes. A stone arriving
           at an attack angle a contacts a patch roughly 1/sin(a) longer than it
           is wide — about 3x at the 20 degree magic angle — laid along the
           direction of travel. Measuring distance in a frame stretched along
           that axis is the cheapest honest way to say so.

           The skew term shears the ellipse sideways. A spinning stone throws
           its spray and its gouge slightly to one side (the same asymmetry that
           gives the run its lateral drift), so the sign of spin leans the
           crater. Small, but it is the difference between a ripple that looks
           stamped on and one that looks made by something moving. */
        vec2 fwd = ax.xy;
        vec2 side = vec2(-fwd.y, fwd.x);
        float alongD = dot(rel, fwd);
        float acrossD = dot(rel, side) + alongD * ax.w;
        float r = length(vec2(alongD / max(ax.z, 0.001), acrossD));

        /* A CRATER WITH A RIM, not a mound.
           Wallace's shader adds a smooth positive bump, because a bump is what
           you want when you are poking a demo pool. It is not what an impact
           makes. Something entering water leaves a HOLE, and the water that was
           in the hole piles up in a ring around it — which is where most of the
           visible splash actually lives, and why a bump reads as stamped-on.

           u is the normalised distance in the stretched frame. w is Wallace's
           profile, used unchanged as the crater lobe; the annulus sin^2(pi*u)
           peaks halfway out and vanishes at both ends, so the rim sits outside
           the hole and the two meet at zero.

           Sign convention: d.w is DEPTH, positive = water pushed down. Every
           caller on this page — impact, plough, sink, raindrop, spray landing —
           means the same thing by it now. */
        float u = clamp(r / d.z, 0.0, 1.0);
        float w = 0.5 - cos((1.0 - u) * PI) * 0.5;
        float ring = sin(u * PI);
        float shape = -w + dropRim * ring * ring;
        info.r += shape * d.w;
    }
    gl_FragColor = info;
}
`;

// His updateShader. Velocity moves toward the neighbour average, attenuates,
// then integrates into height.
const UPDATE_FRAG = `
precision highp float;
varying vec2 vUV;
uniform sampler2D prev;
uniform vec2 delta;
// Live, so ripple lifetime is dialable from the panel. It used to be baked into
// the shader string at load; a constant you have to edit and reload is a
// constant nobody tunes.
uniform float damp;
void main(void) {
    vec4 info = texture2D(prev, vUV);

    vec2 dx = vec2(delta.x, 0.0);
    vec2 dy = vec2(0.0, delta.y);
    float average = (
        texture2D(prev, vUV - dx).r +
        texture2D(prev, vUV - dy).r +
        texture2D(prev, vUV + dx).r +
        texture2D(prev, vUV + dy).r
    ) * 0.25;

    info.g += (average - info.r) * WAVE_C;

    // ABSORBING EDGE, over the same outer 8% the renderer fades across.
    //
    // texture2D clamps at the border, and a clamped neighbour is a mirror: waves
    // reach the window edge and bounce back in. That was invisible while damping
    // killed everything in three seconds. With ripples that live for half a
    // minute it would not be — you would see a wave return from nowhere.
    //
    // It is also a correctness fix independent of lifetime. winFade already
    // makes the RENDERER treat deviation as zero at the edge, so without this
    // the sim carries energy the player cannot see, and a window scroll drags
    // that hidden energy back into view. Measured on a numerical twin of this
    // shader: hidden edge amplitude drops 3-7x, and the peak stops ringing up
    // from 1.00 to 1.31.
    vec2 m = min(vUV, 1.0 - vUV);
    float edge = smoothstep(0.0, 0.08, min(m.x, m.y));
    info.g *= damp * mix(0.55, 1.0, edge);

    info.r += info.g;

    gl_FragColor = info;
}
`.replace(/WAVE_C/g, WAVE_C.toFixed(4));

// Window recentre. Shifts the whole field (height, velocity, normals — every
// channel) by a whole-texel offset so the window can follow the stone without
// ever resampling between texels; content scrolled in from beyond the old
// window is zero, which is correct — deviation out there had faded to nothing
// by construction.
const SCROLL_FRAG = `
precision highp float;
varying vec2 vUV;
uniform sampler2D prev;
uniform vec2 offset;
void main(void) {
    vec2 src = vUV + offset;
    if (src.x < 0.0 || src.x > 1.0 || src.y < 0.0 || src.y > 1.0) {
        gl_FragColor = vec4(0.0);
    } else {
        gl_FragColor = texture2D(prev, src);

}
`;

// His normalShader. One-sided forward differences, cross product, stored into
// the b/a channels as normal.x and normal.z. The y component is implied and is
// reconstructed in the surface shader.
const NORMAL_FRAG = `
precision highp float;
varying vec2 vUV;
uniform sampler2D prev;
uniform vec2 delta;
void main(void) {
    vec4 info = texture2D(prev, vUV);

    vec3 dx = vec3(delta.x, texture2D(prev, vec2(vUV.x + delta.x, vUV.y)).r - info.r, 0.0);
    vec3 dy = vec3(0.0, texture2D(prev, vec2(vUV.x, vUV.y + delta.y)).r - info.r, delta.y);
    info.ba = normalize(cross(dy, dx)).xz;

    gl_FragColor = info;
}
`;

// --- surface -----------------------------------------------------------------
// --- ambient chop ------------------------------------------------------------
// The pond's own motion, independent of anything the player does. It is
// ANALYTIC — a function of world position and time — so it has no texture, no
// domain and no memory cost, and it stays valid however far the pond extends.
// That is what lets the interaction sim later shrink to a window around the
// stone while the rest of the water still lives.
//
// The sim holds the DEVIATION from this, not the water itself. Keeping the two
// separate is what makes a windowed sim seamless later: fade the deviation to
// zero at the window edge and what remains is ambient, which is continuous
// everywhere, so there is no join to hide.
//
// Shared verbatim by the vertex and fragment shaders so the height they
// displace by and the normal they shade with cannot drift apart.
// The precision statement leads, because this block is prepended to the FRAGMENT
// shader too and a fragment shader has no default float precision — declaring a
// float uniform ahead of it is a compile error. Repeating it in the shader body
// below is harmless.
const AMBIENT_GLSL = `
precision highp float;
uniform float time;
uniform float windStrength;   // 0 glass, 1 choppy
uniform vec2 windDir;         // unit vector, the day's wind heading
uniform float detailScale;    // >1 keeps finer detail alive further out, at the
                              // cost of more aliasing. 1 is the Nyquist-honest
                              // setting.
uniform float waveScale;      // stretches all ambient wavelengths together
uniform float blurGain;       // how hard unresolved slope variance blurs the
                              // reflection. 0 disables the filtering entirely.

// One directional wave. Returns height in x, and the world-space slope in yz.
// Speed follows deep-water dispersion, c = sqrt(g * L / 2pi), so LONGER waves
// genuinely travel faster. The interaction sim cannot do that — every wave in a
// height field moves at one speed — so this layer is where the pond gets the
// mixed-scale motion that reads as real water.
// How much of a wave of wavelength L survives at a pixel footprint of fp metres.
// This is Nyquist: once a wavelength drops near the width of a pixel, that wave
// can no longer be shaded, only aliased. Fading it out is not a loss of detail
// so much as an admission that the detail was never resolvable — the sparkle it
// produces is sampling noise, not water.
float detailWeight(float L, float fp) {
    if (fp <= 0.0) return 1.0;
    return smoothstep(fp * 1.2, fp * 3.5, L);
}

vec3 ambientWave(vec2 wp, vec2 dir, float L, float A, float t) {
    float k = 6.2831853 / L;
    float c = sqrt(9.81 * L / 6.2831853);
    float ph = k * dot(dir, wp) - k * c * t;
    return vec3(A * sin(ph), A * cos(ph) * k * dir.x, A * cos(ph) * k * dir.y);
}

// Four octaves, each turned into the day's wind direction. Amplitudes fall
// faster than wavelengths so the surface stays dominated by the long swell and
// the fine chop only textures it.
// The fine parameter scales the two SHORT octaves. The vertex shader passes 0
// and the
// fragment shader passes 1, on purpose: at this pond size the mesh gives about
// 9 cm per quad, so a 15 cm wave spans under two quads and would alias into
// crawling garbage if it were displaced as geometry. Those octaves still exist
// in full for the NORMAL, where they cost nothing and read correctly, so the
// detail is present in the shading without being present in the silhouette.
// waveScale stretches every wavelength together. Amplitude scales with it, so
// wave STEEPNESS (height over length) stays constant and bigger waves read as
// bigger rather than as the same chop inflated. Speed follows for free, because
// the dispersion term is computed from the scaled wavelength — longer swell
// genuinely rolls slower and more heavily.
// The slope variance carried by octaves too fine to resolve at footprint fp.
//
// This is the other half of honest filtering, and the half that was missing.
// Fading an unresolvable wave is correct — but the wave still EXISTS, and what
// it does to a pixel is scatter the reflection over a cone of directions. Throw
// that away and the water flattens to a mirror; represent it as roughness and
// the detail survives as a broader, softer highlight instead of as sparkle.
// So the lost slopes are accumulated here and spent below on blurring the
// environment lookup rather than discarded.
float ambientLostVariance(float fp) {
    float A = windStrength;
    float S = waveScale;
    float v = 0.0;
    float k, sa;
    k = 6.2831853 / (0.90 * S); sa = 0.0045 * A * S * k; v += 0.5 * sa * sa * (1.0 - detailWeight(0.90 * S, fp));
    k = 6.2831853 / (0.55 * S); sa = 0.0028 * A * S * k; v += 0.5 * sa * sa * (1.0 - detailWeight(0.55 * S, fp));
    k = 6.2831853 / (0.28 * S); sa = 0.0014 * A * S * k; v += 0.5 * sa * sa * (1.0 - detailWeight(0.28 * S, fp));
    k = 6.2831853 / (0.15 * S); sa = 0.0007 * A * S * k; v += 0.5 * sa * sa * (1.0 - detailWeight(0.15 * S, fp));
    return v;
}

vec3 ambientField(vec2 wp, float fine, float fp) {
    vec2 w = normalize(windDir + vec2(1e-6, 0.0));
    mat2 rot = mat2(w.x, w.y, -w.y, w.x);
    float A = windStrength;
    float S = waveScale;
    float L0 = 0.90 * S, L1 = 0.55 * S, L2 = 0.28 * S, L3 = 0.15 * S;
    vec3 f = vec3(0.0);
    f += ambientWave(wp, rot * normalize(vec2(1.00,  0.15)), L0, 0.0045 * A * S * detailWeight(L0, fp), time);
    f += ambientWave(wp, rot * normalize(vec2(0.80, -0.60)), L1, 0.0028 * A * S * detailWeight(L1, fp), time);
    f += ambientWave(wp, rot * normalize(vec2(-0.40, 0.90)), L2, 0.0014 * A * S * fine * detailWeight(L2, fp), time);
    f += ambientWave(wp, rot * normalize(vec2(0.20,  1.00)), L3, 0.0007 * A * S * fine * detailWeight(L3, fp), time);
    return f;
}

// The deviation window's contribution at a window-relative UV. Fades to zero
// over the outer 8% of the window, so the field always hands off to pure
// ambient with no join — the whole windowed-sim seam in one function.
float winFade(vec2 rel) {
    vec2 m = min(rel, 1.0 - rel);
    return smoothstep(0.0, 0.08, min(m.x, m.y));
}
`;

BABYLON.Effect.ShadersStore["waterSurfaceVertexShader"] = glsl(AMBIENT_GLSL + `
precision highp float;
attribute vec3 position;
attribute vec2 uv;
uniform mat4 world;
uniform mat4 viewProjection;
uniform sampler2D sim;
uniform vec2 windowCenter;
varying vec2 vRel;
varying vec3 vWorld;

void main(void) {
    vec3 p = position;
    // Ambient is sampled at the UNDISPLACED world position, so the wave pattern
    // is anchored to the world rather than sliding around with its own output.
    vec4 flatW = world * vec4(position, 1.0);
    // The deviation field is a WINDOW on the pond now: world position maps
    // into the window's own [0,1], the same convention the drop pass writes
    // with, and the contribution fades out at the window edge so the surface
    // hands off to pure ambient with no seam. Outside the window the clamp
    // reads an edge texel and the fade multiplies it away.
    vRel = (flatW.xz - windowCenter) / WORLD_SIZE + 0.5;
    float dev = texture2D(sim, clamp(vRel, 0.0, 1.0)).r * winFade(vRel);
    // Heights are already in the plane's own units, exactly as in the original,
    // so there is no height scale to apply.
    // No footprint in the vertex stage: geometry is not what aliases, and there
    // are no derivatives here anyway. Passing 0 keeps every octave at full
    // strength for displacement.
    p.y += dev + ambientField(flatW.xz, 0.0, 0.0).x;
    vec4 wp = world * vec4(p, 1.0);
    vWorld = wp.xyz;
    gl_Position = viewProjection * wp;
}
`.replace(/WORLD_SIZE/g, SIZE.toFixed(1)));

BABYLON.Effect.ShadersStore["waterSurfaceFragmentShader"] = glsl(AMBIENT_GLSL + `
precision highp float;
varying vec2 vRel;
varying vec3 vWorld;
uniform sampler2D sim;
uniform samplerCube envTex;
uniform vec3 cameraPos;
uniform vec3 sunDir;
uniform vec3 tint;

void main(void) {
    // The sim normal comes straight out of the simulation texture, which is the
    // whole reason his normal pass exists. Reconstructing y from x and z works
    // because the stored pair are components of a unit vector.
    // vRel is the window-relative coordinate from the vertex stage; the same
    // edge fade that removes the deviation height removes its normal, so the
    // two cannot disagree at the seam.
    float devFade = winFade(vRel);
    vec4 info = texture2D(sim, clamp(vRel, 0.0, 1.0));
    vec3 Nsim = vec3(info.b, sqrt(max(0.0, 1.0 - dot(info.ba, info.ba))), info.a);

    // Normals do not add — SLOPES do. So both layers are converted to slope,
    // summed, and turned back into a normal once. Adding the two normal vectors
    // instead would wash each layer out as the other got steeper.
    //
    // The scale factor is Evan's convention showing through: his normal pass
    // treats a UV step as the run, while the pond is WORLD_SIZE units across, so
    // his slopes are WORLD_SIZE times the physical ones. Ambient is computed in
    // world space, so it is scaled to match rather than the reverse — that keeps
    // his ported code untouched.
    // How much world lies under one pixel. At a low shore-level view this grows
    // enormously toward the horizon — a single distant pixel can span metres of
    // water, i.e. many whole wave cycles — which is exactly why point-sampling
    // the normal there produced the pixely sparkle rather than a surface.
    vec2 fw = fwidth(vWorld.xz);
    // TWO footprints, deliberately. fpTrue is the honest pixel size and drives
    // the roughness/blur compensation. fp is the artistic one, scaled by the
    // detail slider, and only controls how much amplitude is faded.
    //
    // Keeping them separate matters: they were the same value at first, which
    // meant raising the detail slider also convinced the shader that nothing
    // was unresolved, so it recovered zero variance and applied zero blur —
    // the setting meant to preserve detail was disabling the thing that makes
    // preserved detail safe to look at.
    float fpTrue = max(fw.x, fw.y);
    float fp = fpTrue / max(detailScale, 0.01);

    vec2 simSlope = -Nsim.xz / max(Nsim.y, 1e-4);
    // The sim's own ripples are high-frequency too and alias the same way, so
    // they fade on the same rule. 0.25 m is about their characteristic scale.
    // devFade is the window edge — beyond it there is no deviation, only
    // ambient.
    simSlope *= detailWeight(0.25, fp) * devFade;
    vec3 amb = ambientField(vWorld.xz, 1.0, fp);
    vec2 slope = simSlope + amb.yz * WORLD_SIZE;
    vec3 N = normalize(vec3(-slope.x, 1.0, -slope.y));

    vec3 incomingRay = normalize(vWorld - cameraPos);
    vec3 R = reflect(incomingRay, N);

    // Roughness recovered from the detail that could not be resolved, spent on
    // blurring the reflection. A rough surface reflects a CONE of directions,
    // and a blurred mip is the average over that cone — so even though R still
    // swings wildly from pixel to pixel, it is now sampling a smooth image and
    // the result stops flickering. This is what lets the normals keep their
    // full detail without the reflection tearing itself apart.
    // Skipped entirely when the gain is zero. The variance estimate re-evaluates
    // four more detailWeight terms per pixel, and against a plain sky it was
    // measured to move the aliasing metric by under 5% — not worth paying for at
    // every pixel. It earns its cost once the reflection contains real
    // high-frequency content (a shore, trees, the bank), so the code stays.
    float lod = 0.0;
    if (blurGain > 0.0) {
        float lostVar = ambientLostVariance(fpTrue) * WORLD_SIZE * WORLD_SIZE;
        lod = clamp(log2(1.0 + lostVar * blurGain), 0.0, 7.0);
    }
    vec3 refl = textureCubeLodEXT(envTex, R, lod).rgb;

    // His sun is an extremely tight power lobe, which is what keeps it a small
    // hard glint up close — and it is also the single worst aliasing offender
    // at distance, since a near-delta highlight either hits a pixel centre or
    // misses entirely, producing exactly the crawling white speckle seen at a
    // low viewing angle.
    //
    // Detail that can no longer be resolved is not discarded, it is MOVED: as
    // the tight lobe fades with footprint, a broad one takes over. Physically
    // that is what losing sub-pixel normal variation means — the surface reads
    // as rougher, so its highlight should spread and dim rather than vanish.
    float sunDot = max(0.0, dot(sunDir, R));
    // Also the honest footprint: whether the tight lobe aliases is a fact about
    // pixel size, not about a slider.
    float keep = detailWeight(0.30, fpTrue);
    float sharp = pow(sunDot, 5000.0) * keep;
    float broad = pow(sunDot, 60.0) * (1.0 - keep) * 0.12;
    refl += vec3(sharp + broad) * vec3(10.0, 8.0, 6.0);

    // His Fresnel curve, not the physically exact Schlick term for water. F0 is
    // 0.25 with a cubic falloff, so the surface never goes near-black head-on
    // and ramps to mirror more gently at grazing angles.
    float fresnel = mix(0.25, 1.0, pow(1.0 - dot(N, -incomingRay), 3.0));

    // His shader mixes the reflection against a REFRACTED ray here. With
    // refraction out of scope there is nothing beneath the surface to show, so
    // the transmitted side gets a dimmed, tinted copy of the reflection. That
    // keeps the surface lit by the same environment instead of by an invented
    // colour, which is what stops it reading flat where you look straight down.
    vec3 body = refl * tint;

    gl_FragColor = vec4(mix(body, refl, fresnel), 1.0);
}
`.replace(/WORLD_SIZE/g, SIZE.toFixed(1)));
