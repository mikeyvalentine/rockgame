<script type="module">
// =============================================================================
// THE SKIP LAB. The stone-skipping solver, driving THIS water.
//
// These were two pages until 2026-08-06: a water sim whose "Skip run" button
// marched a canned sequence of impacts across the pond, and a solver demo that
// skipped a stone over a flat plane of its own with wireframe discs for
// splashes. Neither showed the real thing. Now the solver's bounces come back
// through stoneImpact() into this page's spray, foam and ripples, and the
// readout describes the water you are looking at.
//
// A module, because the solver is one and this page's main script is a classic
// script that cannot import. The parameters live over there on `window.SKIP`
// (plain numbers the tuning panel binds to); the physics lives here and reads
// them at throw time.
// =============================================================================
import {
    StoneSkipSim, THROW_PRESETS, PRESET_LABELS, PHYSICS_PROFILES, DEFAULT_ENV,
} from "../stone-skipping-physics/src/stoneSkipping.js";
// The CPU twin of this page's own AMBIENT_GLSL — drift-guarded against it by
// babylon-water/tools/ambient-sync-check.mjs. The stone planes on exactly the
// surface being drawn, which is the reason the twin exists.
import { sampleAmbient, makeAmbientWater } from "../shared/ambientWater.js";
window.waterAmbient = (x, z, t) => sampleAmbient(
    x, z, t !== undefined ? t : performance.now() * 0.001,
    { windStrength: WIND.strength, windDirDeg: WIND.dirDeg, waveScale: WIND.waveScale });
window.makeAmbientWater = makeAmbientWater;

const $ = (id) => document.getElementById(id);

/* ---- profile + preset pickers, prepended to the tuning panel ------------ */
const picker = document.createElement("div");
picker.style.cssText = "margin:0 0 8px";
picker.innerHTML =
    '<select id="skipProfile" style="width:100%;margin-bottom:5px"></select>' +
    '<select id="skipPreset" style="width:100%"></select>';
$("panel").prepend(picker);
for (const name of Object.keys(PHYSICS_PROFILES)) {
    $("skipProfile").add(new Option(name + " profile", name, false, name === SKIP.profile));
}
for (const name of Object.keys(THROW_PRESETS)) {
    $("skipPreset").add(new Option(
        (PRESET_LABELS && PRESET_LABELS[name]) || name, name, false, name === SKIP.preset));
}

/** Assist values come FROM the profile, never from a literal — a stale literal
 *  silently overriding the profile is a bug this project has shipped twice. */
function assistFromProfile(name) {
    const merged = { ...DEFAULT_ENV, ...(PHYSICS_PROFILES[name] || {}) };
    for (const k of ["contactLossScale", "hopSpeedTarget", "hopFlattenLimit",
                     "attitudeAssist", "balanceRetention"]) SKIP.assist[k] = merged[k];
}
assistFromProfile(SKIP.profile);

$("skipProfile").addEventListener("change", (e) => {
    SKIP.profile = e.target.value; assistFromProfile(SKIP.profile);
    syncPanel(); doThrow();
});
$("skipPreset").addEventListener("change", (e) => {
    SKIP.preset = e.target.value;
    Object.assign(SKIP.throw, THROW_PRESETS[SKIP.preset]);
    syncPanel(); doThrow();
});
/** Push changed values back into the panel's inputs. The panel builds its own
 *  refreshers; this reuses them rather than reaching into the DOM. */
function syncPanel() { (window.__panelSync || []).forEach((f) => f()); }

/* ---- the stone ---------------------------------------------------------- */
const stoneMesh = BABYLON.MeshBuilder.CreateCylinder(
    "stone", { diameter: 0.09, height: 0.01, tessellation: 24 }, scene);
const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
stoneMat.diffuseColor = new BABYLON.Color3(0.30, 0.31, 0.33);
stoneMat.specularColor = new BABYLON.Color3(0.12, 0.12, 0.12);
stoneMesh.material = stoneMat;
stoneMesh.rotationQuaternion = BABYLON.Quaternion.Identity();
stoneMesh.isPickable = false;

let sim = null, trail = null, trailPts = [];

function doThrow() {
    stoneMesh.scaling.set(
        SKIP.stone.radius / 0.045, SKIP.stone.thickness / 0.01,
        (SKIP.stone.radius / 0.045) * SKIP.stone.aspect);
    sim = new StoneSkipSim({
        profile: SKIP.profile,
        stone: { ...SKIP.stone },
        // THE POINT OF THE MERGE: the solver samples this page's own surface.
        water: (x, z, t) => sampleAmbient(x, z, t, {
            windStrength: WIND.strength, windDirDeg: WIND.dirDeg, waveScale: WIND.waveScale }),
        env: { ...SKIP.assist },
    });
    // Thrown from the near shore, down the lane, so the run crosses the pond
    // rather than starting in the middle of it.
    sim.throwStone({ ...SKIP.throw, headingDeg: 0, origin: { x: -POND_HALF * 0.42, z: 0 } });
    // The plough integrator carries a running displaced volume across frames.
    // A new throw is not a continuation of the last one, and leaving the old
    // volume in place would make the first frame emit the whole difference as
    // one enormous mound.
    resetDisplace();
    trailPts = [];
    if (trail) { trail.dispose(); trail = null; }
    $("outcome").textContent = "";
}
SKIP.doThrow = doThrow;

/* ---- readout ------------------------------------------------------------ */
function sync() {
    const d = sim.getDiagnostics();
    $("hops").textContent = sim.cleanHops;
    $("rings").textContent = sim.ripples;
    $("csum").textContent = sim.checksum();
    $("dist").textContent = d.distance.toFixed(1) + " m";
    $("rdist").textContent = (sim.runEnded ? sim.runDistance : d.distance).toFixed(1) + " m";
    $("hops").style.color = sim.runEnded ? "#7d8fa3" : "#6fc3ff";
    $("spd").textContent = d.speed.toFixed(1) + " m/s";
    $("atk").textContent = d.attackAngleDeg.toFixed(1) + "\u00b0";
    $("bnk").textContent = d.bankAngleDeg.toFixed(1) + "\u00b0";
    $("spn").textContent = d.spinRPS.toFixed(1) + " rev/s";
    $("ros").textContent = d.rossby.toFixed(1);
    $("drf").textContent = (sim._lateralDrift ? sim._lateralDrift() : 0).toFixed(2) + " m";
    $("phase").textContent = sim.finished
        ? SKIP.profile + " \u2014 settled: " + (sim.settleReason || "")
        : sim.runEnded ? SKIP.profile + " \u2014 coasting / sinking\u2026"
        : SKIP.profile + " \u2014 skipping";
}

/* ---- the loop ----------------------------------------------------------- */
doThrow();
scene.onBeforeRenderObservable.add(() => {
    if (!sim || sim.finished) return;
    const raw = Math.min(engine.getDeltaTime() / 1000, 0.05);
    const dt = SKIP.slow ? raw / 6 : raw;
    /** The stone's own geometry, for turning the solver's penetration prism
     *  back into the depression the surface is actually holding. */
    const faceArea = Math.PI * sim.effRadius * sim.effRadius;
    let bouncedThisFrame = false;
    for (const e of sim.advance(dt)) {
        if (e.type === "bounce") {
            bouncedThisFrame = true;
            // Everything the solver measured about this strike, not a
            // reconstruction of it. The first cut of this passed the OUTGOING
            // velocity as the impact angle and no radius at all, so every
            // bounce made the same round 20 cm dimple regardless of how hard it
            // hit or how shallowly it arrived.
            const v = sim.state.velocity, h = Math.hypot(v.x, v.z) || 1;
            const d = sim.getDiagnostics();
            // Angle from the APPROACH — vertical momentum is what lifts water,
            // and `e.approachSpeed` is the number the solver used to decide the
            // bounce counted at all.
            const angle = Math.atan2(Math.max(0, e.approachSpeed), h);
            stoneImpact(e.position.x, e.position.z, {
                speed: e.speed,
                mass: sim.mass,
                angle,
                dirX: v.x / h, dirZ: v.z / h,
                // The real wetted footprint: how deep it actually went, in the
                // pond-span units the drop shader wants.
                radius: Math.max(sim.effRadius, e.penetration * 3) / SIZE,
                spinRPS: d.spinRPS,
                // ATTITUDE, so the mark is the stone's and not a generic dent.
                // A stone rolled onto an edge digs a narrow gouge; an oblong
                // pebble leaves an oblong scar landing flat.
                bankRad: d.bankAngleDeg * Math.PI / 180,
                aspect: SKIP.stone.aspect,
                // HOW MUCH WATER THIS STRIKE ACTUALLY MOVED.
                //
                // The solver's own peak displaced volume for a contact is
                // penetration * faceArea, but a contact lasts 5-10 ms and a
                // frame is 16.7, so sampling getDisturbance() at frame
                // boundaries misses the peak entirely — that number is usually
                // back at zero by the time this code runs. Reconstructing it
                // from the penetration the bounce event carries agrees with the
                // solver's own peak to within 15% across the whole preset
                // range, measured, and it is available at exactly the moment it
                // is needed.
                volume: 0.8 * Math.PI * sim.effRadius * sim.effRadius * e.penetration,
            });
        }
        if (e.type === "outcome") {
            $("outcome").textContent = e.outcome.replace(/-/g, " ") +
                " \u2014 " + e.cleanHops + " skips, " + e.distance.toFixed(1) + " m";
        }
    }
    // EVERY frame the stone is near or in the water, not just the bounces:
    // ploughing through a contact, chattering, wobbling, coasting after the
    // score has stopped, sinking — and, between all of that, the ram-pressure
    // dimple it drags along underneath itself while airborne. The pond used to
    // go glassy the moment a run stopped scoring, with the stone still visibly
    // dragging through it.
    {
        const g = sim.getDisturbance();
        const dg = sim.getDiagnostics();
        const v = sim.state.velocity, h = Math.hypot(v.x, v.z) || 1;
        const mark = {
            dirX: v.x / h, dirZ: v.z / h,
            spinRPS: dg.spinRPS,
            bankRad: dg.bankAngleDeg * Math.PI / 180,
            aspect: SKIP.stone.aspect,
            faceArea,
            thickness: SKIP.stone.thickness,
            effRadius: sim.effRadius,
            resync: bouncedThisFrame,
        };
        stoneDisplace(g, mark);
        if (!g.contact) {
            // Height above the surface the solver itself is planing on, so the
            // gap is measured against the same water the physics used.
            const p0 = sim.state.position;
            const gap = p0.y - waterAmbient(p0.x, p0.z, sim.state.time);
            stoneGroundEffect(p0.x, p0.z, gap, g.speed, sim.effRadius, mark);
        }
    }

    const p = sim.state.position, q = sim.state.orientation;
    stoneMesh.position.set(p.x, p.y, p.z);
    stoneMesh.rotationQuaternion.set(q.x, q.y, q.z, q.w);

    if (!sim.runEnded) trailPts.push(new BABYLON.Vector3(p.x, p.y, p.z));
    if (trailPts.length > 1) {
        trail = BABYLON.MeshBuilder.CreateLines(
            "tr", { points: trailPts, instance: trail, updatable: true }, scene);
        trail.color = new BABYLON.Color3(0.42, 0.76, 1);
        trail.isPickable = false;
    }
    if (SKIP.follow) {
        camera.target.x += (p.x - camera.target.x) * 0.06;
        camera.target.z += (p.z - camera.target.z) * 0.06;
    }
    sync();
});
</script>
</body>
</html>
