<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skin lab — customization</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="controls">
      <h1>skin</h1>

      <label class="row">
        <span>tone</span>
        <input id="tone" type="range" min="0" max="1" step="0.001" value="0.35" />
      </label>

      <label class="row">
        <input id="free" type="checkbox" />
        <span>any colour</span>
        <input id="color" type="color" value="#e0ac7a" />
      </label>

      <label class="row">
        <span>age</span>
        <input id="age" type="range" min="0" max="1" step="0.001" value="0" />
        <output id="ageOut">18 yrs</output>
      </label>

      <label class="row">
        <span>detail</span>
        <input id="scale" type="range" min="6" max="60" step="1" value="22" />
      </label>
    </div>

    <div id="err" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
