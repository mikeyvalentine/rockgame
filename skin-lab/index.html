<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skin lab — customization</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="controls">
      <header>
        <span class="dot" id="swatch"></span>
        <h1>Skin</h1>
      </header>

      <section class="grp">
        <div class="grp-h">Colour</div>
        <input id="tone" class="tone" type="range" min="0" max="1" step="0.001" value="0.35"
               aria-label="skin tone" />
        <div class="free">
          <label class="chk"><input id="free" type="checkbox" /> Custom</label>
          <input id="color" type="color" value="#e0ac7a" aria-label="custom colour" />
        </div>
      </section>

      <section class="grp">
        <div class="grp-h">Age <output id="ageOut">18</output></div>
        <input id="age" class="age" type="range" min="0" max="1" step="0.001" value="0"
               aria-label="age" />
        <div class="ends"><span>young</span><span>old</span></div>
      </section>

      <details class="adv">
        <summary>Advanced</summary>
        <label class="row"><span>Pore size</span>
          <input id="scale" type="range" min="6" max="60" step="1" value="22" /></label>
      </details>
    </div>

    <div id="err" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
