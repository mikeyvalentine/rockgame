# Build the whole monorepo and publish it to Cloudflare Pages.
#
# Deployment used to be `npm run deploy` from somebody's laptop, which meant
# merging to main changed nothing on the live site and the site's contents
# depended on whose machine ran it. This runs the same script — tools/
# build-site.mjs — on a clean checkout instead.
#
# Two secrets are needed on the repository (Settings → Secrets and variables →
# Actions). Neither belongs in this file:
#
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL or Workers page
#
# Until both exist the deploy step fails; the build still runs, so a broken
# build is caught on every push either way.
#
# Tests do NOT gate the deploy, by request. They live in `ci.yml`, which runs on
# the same push to main as its own workflow, so a red suite is visible without
# holding the site back. The trade is deliberate and worth naming: a failing test
# can now reach the origin, and the signal that something is wrong is the Actions
# tab rather than an absent deployment.
#
# They used to be a `test` job in THIS file, duplicating the lab list. That copy
# had drifted and was missing rock-forge and stone-skipping-physics entirely. One
# definition, in ci.yml, so it cannot drift again.

name: Deploy site

# PUSH TO MAIN, and this is a REVERT of a change made earlier the same day.
#
# The push trigger was removed on 2026-08-06 on the reasoning that Cloudflare
# Pages now builds this repo itself, straight from GitHub, so two systems
# publishing to one Pages project would race. That reasoning was never checked
# against the live site, and it was wrong: the last thing that actually reached
# production was f1920d1 at 18:57 UTC, and every merge after it — the collapse
# of the two labs into one skip lab at 19:03, then PR #19 and PR #20 — was
# invisible. The symptom was a menu still offering "Water" and "Skipping
# physics" as separate pages, three merges after they stopped existing.
#
# Whether the Cloudflare Git integration is connected is a fact about the
# Cloudflare dashboard, not about this repo, and this file cannot see it. What
# it CAN do is make sure main always reaches production by a path this
# repository controls. If the Pages integration is also live, the duplicate
# publish is wasteful but harmless — both build the same commit with the same
# script. A silent four-hour gap between merging and shipping is not harmless,
# and that is the trade the right way round.
#
# The original reason for removing it stands and is worth naming: this path was
# blocked for an evening behind "All GitHub-hosted runners with label
# [ubuntu-latest] are busy". That is why `ci.yml` no longer runs on push to
# main — the five-job matrix already ran on the PR. This is one job.
on:
  push:
    branches: [main]
    # A markdown edit does not need a rebuild and a republish.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race to publish and the
# loser's output is what sticks.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # build-site.mjs picks the shipping assets with `git ls-files`, so the
        # checkout has to be a real repository, not an export.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The labs' node_modules are installed by build-site.mjs itself, so this
      # is the whole build.
      - name: Build
        run: |
          npm ci
          npm run build:site

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name rockgame
