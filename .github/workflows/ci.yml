# Run every lab's test suite, one job per lab.
#
# ## Why one job per lab and not one `npm test`
#
# The labs are tuned individually — a physics tuning pass and a sand-sim pass are
# separate pieces of work, often in separate sessions, and they must be able to go
# red separately. Chaining them into a single script (which is what `deploy.yml`
# used to do) loses that: the first `&&` that fails hides every suite behind it, so
# "tests are red" tells you nothing about which lab to look in, and a lab whose deps
# fail to install silently takes the rest of the monorepo down with it.
#
# One job per lab means the Actions tab reads as a status board — `physics` green,
# `sand-sim` red — and `fail-fast: false` below is what keeps it that way.
#
# ## Coverage this fixes
#
# The suite that used to live in `deploy.yml` ran the hub, sand-sim and rock-sift.
# It did NOT run `rock-forge` or `stone-skipping-physics`, so the solver — the thing
# the whole game's scoring rests on — had never been tested by CI at all. Both are
# in the matrix now.
#
# ## Adding a lab
#
# Add a row to the matrix. The install step keys off whether the lab has a lockfile,
# so a dependency-free lab (`stone-skipping-physics` is one today) needs no special
# case, and one that later grows dependencies starts installing them on its own.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs are worth cancelling; superseded main runs are not, because a
# main run is the record of whether that commit was good.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # THE POINT OF THIS FILE. Without it the first lab to fail cancels the others
      # and you learn about exactly one problem per push.
      fail-fast: false
      matrix:
        include:
          # The app shell. Its suite also carries babylon-water's ambient-sync check,
          # because babylon-water has no package.json of its own.
          - name: hub + babylon-water
            dir: .
            timeout: 10
          # Dependency-free and fast (~40 s): 40 literature checks, the API and mesh
          # audits, and the skill ladder.
          - name: stone-skipping-physics
            dir: stone-skipping-physics
            timeout: 10
          - name: rock-forge
            dir: rock-forge
            timeout: 10
          # Five real Havok runs. The slowest suite in the repo by some way.
          - name: rock-sift
            dir: rock-sift
            timeout: 25
          # Needs rock-forge installed as well, and that is not an accident of the
          # runner. Three of sand-sim's checks (rock-material, bed-load, sift-pad)
          # import rock-forge SOURCE directly, and Node resolves a bare specifier
          # from the importing FILE's directory upward — so
          # `rock-forge/src/babylon/rockMaterial.js` looks in `rock-forge/
          # node_modules`, never in sand-sim's. Installing sand-sim alone leaves
          # those imports unresolvable, which is how this was found.
          #
          # Worth knowing while it stands: sand-sim pins Babylon 9.18 and rock-forge
          # 8.56, so those shared files run against 8.56 no matter what sand-sim
          # asks for. Flagged in docs/audit-2026-08-05.md; not this file's problem
          # to fix, but this is where you will next trip over it.
          - name: sand-sim
            dir: sand-sim
            alsoInstall: rock-forge
            timeout: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sibling labs whose source this lab's suite imports. Separate step so a
      # missing cross-lab install reads as exactly that in the log.
      - name: Install sibling (${{ matrix.alsoInstall }})
        if: matrix.alsoInstall != ''
        working-directory: ${{ matrix.alsoInstall }}
        run: npm ci

      - name: Install
        working-directory: ${{ matrix.dir }}
        # Written as a real `if` rather than `[ -f x ] && npm ci || echo`, because in
        # that form a genuine `npm ci` failure falls through to the `||` and the job
        # goes green on a lab whose dependencies never installed.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile in ${{ matrix.dir }} — dependency-free lab, nothing to install."
          fi

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test
